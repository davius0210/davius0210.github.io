<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
        :root {
            --green: #76ff03;
            --green-d: #64dd17;
            --blue: #29b6f6;
            --purple: #d946ef;
            --bg: #0a0e27;
            --panel: #1a2240;
            --input: #232d4a;
            --text: #ffffff;
            --text2: #b0b9c6;
            --danger: #ff5252;
            --success: #4CAF50;
            --warning: #ff9800;
            --border: #3a4d6a;
            --shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(26,34,64,0.5); }
        ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 4px; }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(26,34,64,0.95);
            border-right: 1px solid var(--border);
            padding: 25px 0;
            position: fixed;
            top: 0; left: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .sidebar-brand {
            font-size: 1.4rem;
            font-weight: 900;
            padding: 0 25px 25px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--green), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-brand i { -webkit-text-fill-color: var(--green); font-size: 1.5rem; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 25px;
            color: var(--text2);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            font-weight: 600;
            text-decoration: none;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--green);
            background: rgba(118,255,3,0.08);
            border-left-color: var(--green);
        }
        .nav-item i { width: 22px; font-size: 1.1rem; }
        .nav-item .badge {
            margin-left: auto;
            background: var(--green);
            color: #000;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 800;
        }

        /* Main */
        .main {
            margin-left: 260px;
            flex: 1;
            padding: 25px 35px;
            min-height: 100vh;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: rgba(26,34,64,0.9);
            border-radius: 15px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .page-title { font-size: 1.8rem; font-weight: 900; color: var(--green); }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--green);
            font-weight: 700;
        }
        .btn-logout {
            background: linear-gradient(135deg, var(--danger), #ff6b6b);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-logout:hover { transform: translateY(-2px); }

        /* Sections */
        .section { display: none; }
        .section.active { display: block; }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(35,45,74,0.8), rgba(26,34,64,0.6));
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            border-color: var(--green);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(118,255,3,0.15);
        }
        .stat-icon { font-size: 2rem; margin-bottom: 10px; }
        .stat-value { font-size: 2.2rem; font-weight: 900; color: var(--green); }
        .stat-label { color: var(--text2); font-size: 0.9rem; font-weight: 600; }

        /* Tables */
        .table-container {
            background: rgba(35,45,74,0.5);
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            border-bottom: 1px solid var(--border);
            background: rgba(26,34,64,0.5);
        }
        .table-header h3 { font-size: 1.2rem; color: var(--green); }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 14px 20px;
            color: var(--text2);
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(58,77,106,0.3);
            font-size: 0.95rem;
            color: var(--text2);
        }
        tr:hover td { background: rgba(118,255,3,0.03); }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .status-published { background: rgba(76,175,80,0.2); color: #4CAF50; }
        .status-draft { background: rgba(255,152,0,0.2); color: var(--warning); }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-edit { background: rgba(41,182,246,0.2); color: var(--blue); }
        .btn-edit:hover { background: var(--blue); color: #000; }
        .btn-delete { background: rgba(255,82,82,0.2); color: var(--danger); }
        .btn-delete:hover { background: var(--danger); color: #fff; }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--green), var(--green-d));
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118,255,3,0.3); }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
        .btn-blue { background: linear-gradient(135deg, var(--blue), #2196F3); color: white; }
        .btn-danger { background: linear-gradient(135deg, var(--danger), #ff6b6b); color: white; }

        /* Form Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, rgba(26,34,64,0.98), rgba(35,45,74,0.98));
            border: 2px solid var(--border);
            border-radius: 20px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 40px rgba(118,255,3,0.2);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(26,34,64,0.95);
            z-index: 1;
        }
        .modal-header h2 { color: var(--green); font-size: 1.5rem; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text2);
            font-size: 2rem;
            cursor: pointer;
            padding: 0 10px;
        }
        .modal-close:hover { color: var(--green); }
        .modal-body { padding: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text);
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: var(--input);
            border: 2px solid var(--border);
            color: var(--text);
            padding: 14px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(118,255,3,0.15);
        }
        .form-group textarea { min-height: 150px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .modal-footer {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            margin-top: 10px;
        }

        /* Settings Form */
        .settings-form { max-width: 700px; }
        .settings-form .form-group { margin-bottom: 25px; }

        /* Loading */
        .loading { text-align: center; padding: 60px 20px; color: var(--text2); }
        .spinner {
            border: 4px solid rgba(58,77,106,0.3);
            border-top: 4px solid var(--green);
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .status-msg {
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }
        .status-msg.show { display: block; }
        .status-msg.success { background: rgba(76,175,80,0.2); color: #4CAF50; border: 1px solid #4CAF50; }
        .status-msg.error { background: rgba(255,82,82,0.2); color: var(--danger); border: 1px solid var(--danger); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text2);
        }
        .empty-state i { font-size: 3rem; margin-bottom: 15px; color: var(--border); }

        /* Quill dark mode fix */
        .ql-toolbar {
            background: var(--panel);
            border-color: var(--border) !important;
            border-radius: 10px 10px 0 0;
        }
        .ql-toolbar .ql-stroke { stroke: var(--text2); }
        .ql-toolbar .ql-fill { fill: var(--text2); }
        .ql-toolbar .ql-picker { color: var(--text2); }
        .ql-toolbar .ql-picker-options { background: var(--panel); border-color: var(--border); }
        .ql-toolbar .ql-picker-item { color: var(--text2); }
        .ql-toolbar .ql-active .ql-stroke { stroke: var(--green); }
        .ql-toolbar .ql-active .ql-fill { fill: var(--green); }
        .ql-toolbar .ql-picker-label:hover,
        .ql-toolbar button:hover { color: var(--green); }
        .ql-toolbar button:hover .ql-stroke { stroke: var(--green); }
        .ql-toolbar button:hover .ql-fill { fill: var(--green); }
        .ql-toolbar .ql-picker-label { border-color: transparent; }
        .ql-toolbar .ql-picker-label.ql-active { color: var(--green); }
        .ql-container { border-color: var(--border) !important; border-radius: 0 0 10px 10px; }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .nav-item span { display: none; }
            .sidebar-brand { padding: 0 15px 20px; justify-content: center; }
            .nav-item { padding: 14px 18px; justify-content: center; }
            .nav-item .badge { display: none; }
            .main { margin-left: 60px; padding: 15px; }
            .form-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .table-header { flex-direction: column; gap: 10px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <script>if(localStorage.getItem('isLoggedIn')!=='true'){window.location.href="login.html";}</script>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-cubes"></i>
            <span>CMS Panels</span>
        </div>
        <div class="nav-item active" data-section="dashboard">
            <i class="fas fa-th-large"></i> <span>Dashboard</span>
        </div>
        <div class="nav-item" data-section="pages">
            <i class="fas fa-file-alt"></i> <span>Pages</span>
            <span class="badge" id="nav-pages-count">0</span>
        </div>
        <div class="nav-item" data-section="posts">
            <i class="fas fa-newspaper"></i> <span>Posts</span>
            <span class="badge" id="nav-posts-count">0</span>
        </div>
        <div class="nav-item" data-section="settings">
            <i class="fas fa-cog"></i> <span>Settings</span>
        </div>
        <div style="border-top: 1px solid var(--border); margin: 20px 25px 0;"></div>
        <div class="nav-item" onclick="window.location.href='index.html'" style="cursor:pointer;">
            <i class="fas fa-external-link-alt"></i> <span>View Site</span>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="top-bar">
            <div class="page-title" id="section-title">Dashboard</div>
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span id="display-username">Admin</span>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div id="status-msg" class="status-msg"></div>

        <!-- DASHBOARD -->
        <div class="section active" id="section-dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📄</div>
                    <div class="stat-value" id="stat-pages">0</div>
                    <div class="stat-label">Total Pages</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📰</div>
                    <div class="stat-value" id="stat-posts">0</div>
                    <div class="stat-label">Total Posts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-value" id="stat-published">0</div>
                    <div class="stat-label">Published</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📝</div>
                    <div class="stat-value" id="stat-drafts">0</div>
                    <div class="stat-label">Drafts</div>
                </div>
            </div>
            <div style="background: rgba(35,45,74,0.5); border: 1px solid var(--border); border-radius: 15px; padding: 25px;">
                <h3 style="color: var(--green); margin-bottom: 10px;">Quick Actions</h3>
                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button class="btn" onclick="switchSection('pages'); openPageModal()"><i class="fas fa-plus"></i> New Page</button>
                    <button class="btn btn-blue" onclick="switchSection('posts'); openPostModal()"><i class="fas fa-plus"></i> New Post</button>
                    <button class="btn" onclick="switchSection('settings')"><i class="fas fa-cog"></i> Settings</button>
                </div>
            </div>
        </div>

        <!-- PAGES -->
        <div class="section" id="section-pages">
            <div class="table-container">
                <div class="table-header">
                    <h3><i class="fas fa-file-alt"></i> All Pages</h3>
                    <button class="btn btn-sm" onclick="openPageModal()"><i class="fas fa-plus"></i> New Page</button>
                </div>
                <div id="pages-list"><div class="loading"><div class="spinner"></div></div></div>
            </div>
        </div>

        <!-- POSTS -->
        <div class="section" id="section-posts">
            <div class="table-container">
                <div class="table-header">
                    <h3><i class="fas fa-newspaper"></i> All Posts</h3>
                    <button class="btn btn-sm btn-blue" onclick="openPostModal()"><i class="fas fa-plus"></i> New Post</button>
                </div>
                <div id="posts-list"><div class="loading"><div class="spinner"></div></div></div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div class="section" id="section-settings">
            <div class="table-container">
                <div class="table-header">
                    <h3><i class="fas fa-cog"></i> Site Settings</h3>
                </div>
                <div style="padding: 30px;">
                    <div class="settings-form" id="settings-form">
                        <div class="loading"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE MODAL -->
    <div class="modal" id="pageModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="pageModalTitle">New Page</h2>
                <button class="modal-close" onclick="closeModal('pageModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="page-id">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="page-title" placeholder="Page title" oninput="generateSlug('page')">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text" id="page-slug" placeholder="page-slug">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="page-status">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <div id="page-editor" style="min-height:300px;background:var(--input);border:2px solid var(--border);border-radius:10px;color:var(--text);"></div>
                </div>
                <input type="hidden" id="page-content">
                <div class="modal-footer">
                    <button class="btn btn-blue" onclick="closeModal('pageModal')">Cancel</button>
                    <button class="btn" onclick="savePage()"><i class="fas fa-save"></i> Save Page</button>
                </div>
            </div>
        </div>
    </div>

    <!-- POST MODAL -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="postModalTitle">New Post</h2>
                <button class="modal-close" onclick="closeModal('postModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="post-id">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="post-title" placeholder="Post title" oninput="generateSlug('post')">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Slug</label>
                        <input type="text" id="post-slug" placeholder="post-slug">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="post-category" placeholder="e.g. News, Tutorial">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="post-image" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="post-status">
                            <option value="published">Published</option>
                            <option value="draft">Draft</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Excerpt</label>
                    <textarea id="post-excerpt" placeholder="Short summary..." style="min-height: 60px;"></textarea>
                </div>
                <div class="form-group">
                    <label>Content</label>
                    <div id="post-editor" style="min-height:300px;background:var(--input);border:2px solid var(--border);border-radius:10px;color:var(--text);"></div>
                </div>
                <input type="hidden" id="post-content">
                <div class="modal-footer">
                    <button class="btn btn-blue" onclick="closeModal('postModal')">Cancel</button>
                    <button class="btn" onclick="savePost()"><i class="fas fa-save"></i> Save Post</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxqQOEuFjIR2W9-lrtAjaYsqPMHa8-6X4",
            authDomain: "jimmy-27ea1.firebaseapp.com",
            databaseURL: "https://jimmy-27ea1.firebaseio.com",
            projectId: "jimmy-27ea1",
            storageBucket: "jimmy-27ea1.appspot.com",
            messagingSenderId: "1053115589398",
            appId: "1:1053115589398:web:f8f300891ea3c2d81be637",
            measurementId: "G-0VV0WP7VZ3"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userName = localStorage.getItem('userName');
        if (userName) document.getElementById('display-username').innerText = userName;

        window.logout = () => {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userName');
            window.location.href = "login.html";
        };

        // Navigation
        document.querySelectorAll('.nav-item[data-section]').forEach(item => {
            item.addEventListener('click', () => switchSection(item.dataset.section));
        });
        window.switchSection = (section) => {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelector(`.nav-item[data-section="${section}"]`).classList.add('active');
            document.getElementById(`section-${section}`).classList.add('active');
            document.getElementById('section-title').innerText = section.charAt(0).toUpperCase() + section.slice(1);
            if (section === 'pages') loadPages();
            if (section === 'posts') loadPosts();
            if (section === 'settings') loadSettings();
            if (section === 'dashboard') loadDashboard();
        };

        // Helpers
        function showStatus(msg, type) {
            const el = document.getElementById('status-msg');
            el.textContent = msg;
            el.className = 'status-msg show ' + type;
            setTimeout(() => el.classList.remove('show'), 4000);
        }
        function slugify(text) {
            return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        }
        window.generateSlug = (type) => {
            const title = document.getElementById(`${type}-title`).value;
            const slug = document.getElementById(`${type}-slug`);
            if (!slug.dataset.edited) slug.value = slugify(title);
        };
        document.querySelectorAll('#page-slug, #post-slug').forEach(el => {
            el.addEventListener('input', () => el.dataset.edited = 'true');
        });
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        window.openModal = (id) => document.getElementById(id).classList.add('active');

        // --- DASHBOARD ---
        async function loadDashboard() {
            try {
                const pagesSnap = await getDocs(collection(db, "pages"));
                const postsSnap = await getDocs(collection(db, "posts"));
                let published = 0, drafts = 0;
                postsSnap.forEach(d => { if (d.data().status === 'published') published++; else drafts++; });
                pagesSnap.forEach(d => { if (d.data().status === 'published') published++; else drafts++; });
                document.getElementById('stat-pages').textContent = pagesSnap.size;
                document.getElementById('stat-posts').textContent = postsSnap.size;
                document.getElementById('stat-published').textContent = published;
                document.getElementById('stat-drafts').textContent = drafts;
                document.getElementById('nav-pages-count').textContent = pagesSnap.size;
                document.getElementById('nav-posts-count').textContent = postsSnap.size;
            } catch (e) {
                console.error(e);
            }
        }

        // --- PAGES ---
        async function loadPages() {
            const container = document.getElementById('pages-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const snap = await getDocs(collection(db, "pages"));
                if (snap.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-file-alt"></i><p>No pages yet.</p></div>';
                    return;
                }
                const docs = [];
                snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
                docs.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                let html = `<table><thead><tr><th>Title</th><th>Slug</th><th>Status</th><th style="width:120px">Actions</th></tr></thead><tbody>`;
                docs.forEach(p => {
                    html += `<tr>
                        <td style="color:var(--text);font-weight:600">${p.title}</td>
                        <td>/${p.slug || ''}</td>
                        <td><span class="status-badge ${p.status === 'published' ? 'status-published' : 'status-draft'}">${p.status || 'draft'}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editPage('${p.id}')"><i class="fas fa-edit"></i></button>
                                <button class="btn-delete" onclick="deletePage('${p.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);font-size:2rem;margin-bottom:10px;"></i><p style="color:var(--danger);font-weight:700;">Error loading pages</p><p style="font-size:0.85rem;margin-top:10px;color:var(--text2);">${e.code || ''} ${e.message || ''}</p></div>`;
                console.error(e);
            }
        }

        window.openPageModal = (data) => {
            document.getElementById('page-id').value = data?.id || '';
            document.getElementById('page-title').value = data?.title || '';
            document.getElementById('page-slug').value = data?.slug || '';
            document.getElementById('page-slug').dataset.edited = data?.slug ? 'true' : '';
            document.getElementById('page-status').value = data?.status || 'published';
            document.getElementById('page-content').value = data?.content || '';
            document.getElementById('pageModalTitle').textContent = data?.id ? 'Edit Page' : 'New Page';
            openModal('pageModal');
        };

        window.editPage = async (id) => {
            try {
                const snap = await getDoc(doc(db, "pages", id));
                if (snap.exists()) openPageModal({ id, ...snap.data() });
            } catch (e) { console.error(e); }
        };

        window.savePage = async () => {
            const id = document.getElementById('page-id').value;
            const data = {
                title: document.getElementById('page-title').value.trim(),
                slug: document.getElementById('page-slug').value.trim() || slugify(document.getElementById('page-title').value),
                status: document.getElementById('page-status').value,
                content: document.getElementById('page-content').value.trim(),
                updatedAt: serverTimestamp()
            };
            if (!data.title) { showStatus('Title required.', 'error'); return; }
            try {
                if (id) {
                    await updateDoc(doc(db, "pages", id), data);
                    showStatus('Page updated!', 'success');
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "pages"), data);
                    showStatus('Page created!', 'success');
                }
                closeModal('pageModal');
                loadPages();
                loadDashboard();
            } catch (e) { showStatus('Error: ' + e.message, 'error'); }
        };

        window.deletePage = async (id) => {
            if (!confirm('Delete this page?')) return;
            try {
                await deleteDoc(doc(db, "pages", id));
                showStatus('Page deleted.', 'success');
                loadPages();
                loadDashboard();
            } catch (e) { showStatus('Error: ' + e.message, 'error'); }
        };

        // --- POSTS ---
        async function loadPosts() {
            const container = document.getElementById('posts-list');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const snap = await getDocs(collection(db, "posts"));
                if (snap.empty) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-newspaper"></i><p>No posts yet.</p></div>';
                    return;
                }
                const docs = [];
                snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
                docs.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
                let html = `<table><thead><tr><th>Title</th><th>Category</th><th>Status</th><th style="width:120px">Actions</th></tr></thead><tbody>`;
                docs.forEach(p => {
                    html += `<tr>
                        <td style="color:var(--text);font-weight:600">${p.title}</td>
                        <td>${p.category || '-'}</td>
                        <td><span class="status-badge ${p.status === 'published' ? 'status-published' : 'status-draft'}">${p.status || 'draft'}</span></td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editPost('${p.id}')"><i class="fas fa-edit"></i></button>
                                <button class="btn-delete" onclick="deletePost('${p.id}')"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:var(--danger);font-size:2rem;margin-bottom:10px;"></i><p style="color:var(--danger);font-weight:700;">Error loading posts</p><p style="font-size:0.85rem;margin-top:10px;color:var(--text2);">${e.code || ''} ${e.message || ''}</p></div>`;
                console.error(e);
            }
        }

        window.openPostModal = (data) => {
            document.getElementById('post-id').value = data?.id || '';
            document.getElementById('post-title').value = data?.title || '';
            document.getElementById('post-slug').value = data?.slug || '';
            document.getElementById('post-slug').dataset.edited = data?.slug ? 'true' : '';
            document.getElementById('post-category').value = data?.category || '';
            document.getElementById('post-image').value = data?.image || '';
            document.getElementById('post-status').value = data?.status || 'published';
            document.getElementById('post-excerpt').value = data?.excerpt || '';
            document.getElementById('post-content').value = data?.content || '';
            document.getElementById('postModalTitle').textContent = data?.id ? 'Edit Post' : 'New Post';
            openModal('postModal');
        };

        window.editPost = async (id) => {
            try {
                const snap = await getDoc(doc(db, "posts", id));
                if (snap.exists()) openPostModal({ id, ...snap.data() });
            } catch (e) { console.error(e); }
        };

        window.savePost = async () => {
            const id = document.getElementById('post-id').value;
            const data = {
                title: document.getElementById('post-title').value.trim(),
                slug: document.getElementById('post-slug').value.trim() || slugify(document.getElementById('post-title').value),
                category: document.getElementById('post-category').value.trim(),
                image: document.getElementById('post-image').value.trim(),
                status: document.getElementById('post-status').value,
                excerpt: document.getElementById('post-excerpt').value.trim(),
                content: document.getElementById('post-content').value.trim(),
                updatedAt: serverTimestamp()
            };
            if (!data.title) { showStatus('Title required.', 'error'); return; }
            try {
                if (id) {
                    await updateDoc(doc(db, "posts", id), data);
                    showStatus('Post updated!', 'success');
                } else {
                    data.createdAt = serverTimestamp();
                    await addDoc(collection(db, "posts"), data);
                    showStatus('Post created!', 'success');
                }
                closeModal('postModal');
                loadPosts();
                loadDashboard();
            } catch (e) { showStatus('Error: ' + e.message, 'error'); }
        };

        window.deletePost = async (id) => {
            if (!confirm('Delete this post?')) return;
            try {
                await deleteDoc(doc(db, "posts", id));
                showStatus('Post deleted.', 'success');
                loadPosts();
                loadDashboard();
            } catch (e) { showStatus('Error: ' + e.message, 'error'); }
        };

        // --- SETTINGS ---
        async function loadSettings() {
            const form = document.getElementById('settings-form');
            form.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const snap = await getDoc(doc(db, "settings", "general"));
                const s = snap.exists() ? snap.data() : {};
                form.innerHTML = `
                    <div class="form-group">
                        <label>Site Name</label>
                        <input type="text" id="s-name" value="${s.siteName || ''}" placeholder="My CMS">
                    </div>
                    <div class="form-group">
                        <label>Site Description</label>
                        <textarea id="s-desc" placeholder="Site description..." style="min-height:80px;">${s.siteDescription || ''}</textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Logo URL</label>
                            <input type="url" id="s-logo" value="${s.logo || ''}" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Footer Text</label>
                            <input type="text" id="s-footer" value="${s.footerText || ''}" placeholder="© 2024 My CMS">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Contact Email</label>
                        <input type="email" id="s-email" value="${s.contactEmail || ''}" placeholder="admin@example.com">
                    </div>
                    <button class="btn" onclick="saveSettings()"><i class="fas fa-save"></i> Save Settings</button>
                `;
            } catch (e) {
                form.innerHTML = '<div class="empty-state">Error loading settings.</div>';
            }
        }

        window.saveSettings = async () => {
            const data = {
                siteName: document.getElementById('s-name').value.trim(),
                siteDescription: document.getElementById('s-desc').value.trim(),
                logo: document.getElementById('s-logo').value.trim(),
                footerText: document.getElementById('s-footer').value.trim(),
                contactEmail: document.getElementById('s-email').value.trim(),
                updatedAt: serverTimestamp()
            };
            try {
                await setDoc(doc(db, "settings", "general"), data, { merge: true });
                showStatus('Settings saved!', 'success');
            } catch (e) {
                showStatus('Error: ' + e.message, 'error');
            }
        };

        // Load dashboard on init
        loadDashboard();

        // Initialize Quill editors
        let quillPage, quillPost;
        try {
            quillPage = new Quill('#page-editor', {
                theme: 'snow',
                placeholder: 'Write page content here...',
                modules: {
                    toolbar: [
                        [{ 'header': [1,2,3,4,5,6,false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'list': 'check' }],
                        [{ 'align': [] }],
                        ['blockquote', 'code-block'],
                        [{ 'indent': '-1'}, { 'indent': '+1' }],
                        ['link', 'image', 'video'],
                        [{ 'direction': 'rtl' }],
                        ['clean']
                    ]
                }
            });

            quillPost = new Quill('#post-editor', {
                theme: 'snow',
                placeholder: 'Write post content here...',
                modules: {
                    toolbar: [
                        [{ 'header': [1,2,3,4,5,6,false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'list': 'check' }],
                        [{ 'align': [] }],
                        ['blockquote', 'code-block'],
                        [{ 'indent': '-1'}, { 'indent': '+1' }],
                        ['link', 'image', 'video'],
                        [{ 'direction': 'rtl' }],
                        ['clean']
                    ]
                }
            });

            // Patch openPageModal to set Quill content
            const origOpenPageModal = window.openPageModal;
            window.openPageModal = (data) => {
                origOpenPageModal(data);
                if (quillPage) quillPage.root.innerHTML = data?.content || '';
            };

            // Patch openPostModal to set Quill content
            const origOpenPostModal = window.openPostModal;
            window.openPostModal = (data) => {
                origOpenPostModal(data);
                if (quillPost) quillPost.root.innerHTML = data?.content || '';
            };

            // Patch savePage to get HTML from Quill
            const origSavePage = window.savePage;
            window.savePage = () => {
                if (quillPage) document.getElementById('page-content').value = quillPage.root.innerHTML;
                origSavePage();
            };

            // Patch savePost to get HTML from Quill
            const origSavePost = window.savePost;
            window.savePost = () => {
                if (quillPost) document.getElementById('post-content').value = quillPost.root.innerHTML;
                origSavePost();
            };

            // Clear Quill content when modal closes
            const origCloseModal = window.closeModal;
            window.closeModal = (id) => {
                origCloseModal(id);
                if (id === 'pageModal' && quillPage) quillPage.setContents([], 'silent');
                if (id === 'postModal' && quillPost) quillPost.setContents([], 'silent');
            };
        } catch (e) {
            console.warn('Quill init failed:', e);
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
</body>
</html>
