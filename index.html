<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Powered by Davius">
    <meta property="og:title" content="Davius">
    <meta property="og:description" content="Powered by Davius.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235488c0'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='white'%3ED%3C/text%3E%3C/svg%3E">
    <title>Davius</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --primary: #5488c0;
            --primary-d: #3f6da3;
            --bg-start: #a9c5e3;
            --bg-end: #4da6a9;
            --paper: #f4f1ea;
            --paper-edge: #e2dec9;
            --paper-blue: #cfe0f1;
            --ink: #334155;
            --ink-soft: #64748b;
            --accent: #4ade80;
            --accent-d: #16a34a;
            --card: #ffffff;
            --border: #cbd5e1;
            --radius: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--ink);
            overflow-x: hidden;
            min-height: 100dvh;
            font-variant-numeric: tabular-nums;
        }

        .font-display {
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Checkered backdrop like reference */
        .checkered-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.1) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.1) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.1) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }

        /* Paper craft shapes */
        .paper-panel {
            clip-path: polygon(1% 2%, 98% 1%, 100% 98%, 2% 100%, 0% 50%);
        }

        .paper-scrap {
            clip-path: polygon(5% 0%, 95% 5%, 100% 90%, 92% 100%, 8% 95%, 0% 80%);
        }

        .wavy-button {
            clip-path: polygon(0% 20%, 15% 0%, 85% 10%, 100% 20%, 95% 80%, 80% 100%, 20% 90%, 0% 80%);
        }

        .hexagon {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }

        :focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .skip-link {
            position: absolute;
            left: -999px;
            top: 8px;
            background: var(--ink);
            color: #fff;
            padding: 10px 18px;
            font-weight: 700;
            z-index: 3000;
        }

        .skip-link:focus {
            left: 8px;
        }

        .admin-link {
            color: var(--ink-soft) !important;
        }

        .page-wrapper {
            padding: 28px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--paper);
            border-right: 4px solid var(--paper-edge);
            border-bottom: 4px solid var(--paper-edge);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
        }

        .navbar {
            background: var(--paper);
            border-bottom: 3px dashed var(--paper-edge);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .navbar-brand {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            letter-spacing: 0.04em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: #fff;
            font-size: 1.4rem;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a,
        .nav-links button {
            color: var(--ink-soft);
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
            padding: 8px 14px;
            font-size: 0.92rem;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .nav-links a:hover,
        .nav-links a.active,
        .nav-links button:hover,
        .nav-links button.active {
            color: var(--primary);
            background: var(--paper-blue);
        }

        .content-area {
            padding: 40px;
            min-height: 400px;
        }

        /* Hero */
        .hero {
            text-align: left;
            padding: 56px 12px 44px;
            position: relative;
            max-width: 68ch;
        }

        .hero h1 {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.4rem, 5vw, 3.4rem);
            letter-spacing: 0.02em;
            line-height: 1.05;
            color: var(--ink);
            margin-bottom: 15px;
            text-wrap: balance;
            text-transform: uppercase;
        }

        .hero h1 .accent {
            color: var(--primary);
        }

        .hero p {
            color: var(--ink-soft);
            font-size: 1.1rem;
            max-width: 65ch;
            line-height: 1.7;
            font-weight: 600;
        }

        .hero .cta-btns {
            margin-top: 28px;
            display: flex;
            gap: 14px;
            justify-content: flex-start;
            flex-wrap: wrap;
            align-items: center;
        }

        .hero .cta-btns button,
        .hero .cta-btns a {
            padding: 14px 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
            font-family: inherit;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.05em;
            border-bottom: 6px solid var(--accent-d);
            text-transform: uppercase;
            clip-path: polygon(0% 20%, 15% 0%, 85% 10%, 100% 20%, 95% 80%, 80% 100%, 20% 90%, 0% 80%);
        }

        .btn-primary:hover {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .hero .cta-btns button:active,
        .hero .cta-btns a:active,
        .btn-primary:active {
            transform: translateY(2px);
        }

        .btn-outline {
            background: #fff;
            color: var(--ink-soft);
            border: 2px solid var(--border) !important;
            font-weight: 700;
            clip-path: polygon(5% 0%, 95% 5%, 100% 90%, 92% 100%, 8% 95%, 0% 80%);
        }

        .btn-outline:hover {
            color: var(--primary);
            border-color: var(--primary) !important;
            transform: rotate(-1deg);
        }

        /* Section */
        .section-title {
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 0.85rem;
            margin: 40px 0 22px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding-left: 8px;
        }

        /* Page Content */
        .page-content {
            color: var(--ink-soft);
            line-height: 1.9;
            font-size: 1rem;
            font-weight: 500;
        }

        .page-content h1,
        .page-content h2,
        .page-content h3 {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.02em;
            color: var(--ink);
            margin: 25px 0 15px;
            text-wrap: balance;
        }

        .page-content h1 {
            font-size: 2rem;
        }

        .page-content h2 {
            font-size: 1.5rem;
        }

        .page-content h3 {
            font-size: 1.2rem;
        }

        .page-content p {
            margin-bottom: 15px;
        }

        .page-content ul,
        .page-content ol {
            padding-left: 25px;
            margin-bottom: 15px;
        }

        .page-content li {
            margin-bottom: 8px;
        }

        .page-content a {
            color: var(--primary);
            font-weight: 700;
        }

        .page-content img {
            max-width: 100%;
            margin: 20px 0;
        }

        .page-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            margin: 20px 0;
            background: var(--paper-blue);
        }

        /* Posts Grid — asymmetric: lead story spans two columns */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 20px;
        }

        @media (min-width: 900px) {
            .posts-grid .post-card:first-child {
                grid-column: span 2;
            }

            .posts-grid .post-card:first-child .post-image {
                height: 260px;
            }
        }

        .post-card {
            background: var(--card);
            border: 2px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .post-card:nth-child(odd) {
            --rz: -0.4deg;
        }

        .post-card:nth-child(even) {
            --rz: 0.4deg;
        }

        .post-card:hover {
            --rz: 0deg;
            --lift: -10px;
            border-color: var(--primary);
        }

        .post-image {
            height: 200px;
            background: var(--paper-blue);
            overflow: hidden;
            border-bottom: 2px solid var(--border);
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .post-card:hover .post-image img {
            transform: scale(1.12) translate3d(calc(var(--px, 0) * -18px), calc(var(--py, 0) * -18px), 0);
        }

        .post-card.is-tilting .post-image img {
            transition: transform 0.12s linear;
        }

        .post-info {
            padding: 22px;
        }

        .post-category {
            display: inline-block;
            background: var(--paper-blue);
            color: var(--primary-d);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 5px 12px;
            margin-bottom: 10px;
        }

        .post-title {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.02em;
            color: var(--ink);
            font-size: 1.15rem;
            margin-bottom: 8px;
            text-wrap: balance;
        }

        .post-excerpt {
            color: var(--ink-soft);
            font-size: 0.92rem;
            line-height: 1.6;
            max-width: 65ch;
            font-weight: 500;
        }

        /* Contact */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .contact-item {
            padding: 18px 20px;
            background: #fff;
            border: 2px solid var(--border);
            color: var(--ink-soft);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .contact-item:hover {
            border-color: var(--primary);
            --rz: -1deg;
            --lift: -6px;
        }

        .contact-item:hover .contact-icon {
            transform: translateZ(0) rotateY(180deg);
        }

        .contact-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: var(--paper-blue);
            color: var(--primary-d);
            flex-shrink: 0;
            transition: transform 0.6s cubic-bezier(.2, .8, .2, 1);
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 22px 28px;
            border-top: 3px dashed var(--paper-edge);
            color: var(--ink-soft);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .footer nav {
            display: flex;
            gap: 18px;
        }

        .footer a {
            color: var(--ink-soft);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            color: var(--primary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(51, 65, 85, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--paper);
            border-right: 4px solid var(--paper-edge);
            border-bottom: 4px solid var(--paper-edge);
            width: 90%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px;
            border-bottom: 3px dashed var(--paper-edge);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.02em;
            color: var(--ink);
            font-size: 1.4rem;
        }

        .modal-close {
            background: #fff;
            border: 2px solid var(--border);
            color: var(--ink-soft);
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, color 0.2s ease;
            font-family: inherit;
        }

        .modal-close:hover {
            color: var(--primary);
            border-color: var(--primary);
            transform: rotate(90deg);
        }

        .modal-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-body .post-category {
            margin-bottom: 10px;
        }

        .modal-body .page-content {
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-soft);
            font-weight: 600;
        }

        /* Skeleton loader matching card shape */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 20px;
        }

        .skeleton-card {
            border: 2px solid var(--border);
            overflow: hidden;
            background: #fff;
        }

        .skeleton-block {
            background: linear-gradient(90deg, var(--paper-edge) 25%, #fff 50%, var(--paper-edge) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .spinner {
            border: 4px solid var(--paper-edge);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--paper-edge);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
        }

        /* Posts toolbar: search + category filter */
        .posts-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 6px;
        }

        .posts-toolbar input,
        .posts-toolbar select {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--border);
            padding: 10px 14px;
        }

        .posts-toolbar input {
            flex: 1;
            min-width: 200px;
        }

        .posts-toolbar input:focus,
        .posts-toolbar select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .post-meta {
            color: var(--ink-soft);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .tag-chip {
            background: #fff;
            border: 2px solid var(--border);
            color: var(--ink-soft);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
        }

        .site-logo {
            height: 40px;
            width: auto;
            display: none;
        }

        /* Comments */
        .comments-box {
            margin-top: 28px;
            border-top: 3px dashed var(--paper-edge);
            padding-top: 20px;
        }

        .comments-box h3 {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.03em;
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 14px;
        }

        .comment-item {
            background: #fff;
            border: 2px solid var(--border);
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .comment-item .comment-head {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-d);
            margin-bottom: 4px;
        }

        .comment-item .comment-date {
            font-weight: 600;
            color: var(--ink-soft);
        }

        .comment-item p {
            color: var(--ink-soft);
            font-size: 0.92rem;
            line-height: 1.6;
            margin: 0;
        }

        .comment-form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 12px 0 6px;
        }

        .comment-form input,
        .comment-form textarea {
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--border);
            padding: 10px 14px;
        }

        .comment-form input:focus,
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .comment-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .comment-form button {
            margin-top: 12px;
            padding: 12px 26px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-bottom: 5px solid var(--accent-d);
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .comment-form button:hover { transform: scale(1.03); }
        .comment-form button:disabled { opacity: 0.6; cursor: wait; transform: none; }

        .form-note {
            font-size: 0.82rem;
            color: var(--ink-soft);
            margin-top: 10px;
            display: none;
        }

        /* ============================================================
           3D LAYER — dipakai bersama js/index-3d.js
           ============================================================ */
        :root {
            --ease-3d: cubic-bezier(.2, .8, .2, 1);
            --extrude: #c9c3ab;
        }

        #bg3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
        }

        /* Panel utama "jatuh" ke tempatnya dengan rotasi 3D */
        .page-wrapper {
            perspective: 1600px;
        }

        .container {
            animation: panel-in 1s var(--ease-3d) both;
            transform-origin: 50% 0;
            box-shadow:
                8px 8px 0 rgba(0, 0, 0, 0.12),
                0 30px 60px -20px rgba(20, 50, 80, 0.45);
        }

        @keyframes panel-in {
            from {
                opacity: 0;
                transform: rotateX(14deg) translate3d(0, 60px, -120px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Brand: kubus yang berputar */
        .brand-icon {
            transition: transform 0.7s var(--ease-3d);
            box-shadow: inset -4px -4px 0 rgba(0, 0, 0, 0.18), inset 3px 3px 0 rgba(255, 255, 255, 0.25);
        }

        .navbar-brand {
            perspective: 400px;
        }

        .navbar-brand:hover .brand-icon {
            transform: rotateY(360deg) rotateX(20deg);
        }

        #site-name {
            text-shadow: 1px 1px 0 var(--extrude), 2px 2px 0 var(--extrude), 3px 3px 0 rgba(0, 0, 0, 0.08);
        }

        /* Tombol navigasi: tombol kertas timbul */
        .nav-links {
            perspective: 600px;
        }

        .nav-links a,
        .nav-links button {
            transform-style: preserve-3d;
            box-shadow: 0 0 0 transparent;
            transition: transform 0.25s var(--ease-3d), color 0.2s ease, background 0.2s ease, box-shadow 0.25s var(--ease-3d);
        }

        .nav-links a:hover,
        .nav-links button:hover,
        .nav-links a.active,
        .nav-links button.active {
            transform: translate3d(0, -3px, 0) rotateX(12deg);
            box-shadow: 0 4px 0 #a9c1dc, 0 10px 14px -6px rgba(63, 109, 163, 0.45);
        }

        .nav-links a:active,
        .nav-links button:active {
            transform: translate3d(0, 1px, 0);
            box-shadow: 0 1px 0 #a9c1dc;
        }

        /* Hero: teks timbul + pulau voxel 3D */
        .hero {
            perspective: 900px;
        }

        .hero h1 {
            text-shadow:
                1px 1px 0 var(--extrude),
                2px 2px 0 var(--extrude),
                3px 3px 0 var(--extrude),
                4px 4px 0 #bdb69c,
                5px 5px 0 #bdb69c,
                8px 12px 18px rgba(20, 50, 80, 0.25);
        }

        .hero h1 .accent {
            text-shadow:
                1px 1px 0 #3f6da3,
                2px 2px 0 #3f6da3,
                3px 3px 0 #3f6da3,
                4px 4px 0 #2f5585,
                5px 5px 0 #2f5585,
                8px 12px 18px rgba(20, 50, 80, 0.3);
        }

        .hero--3d {
            max-width: none;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
            grid-template-rows: auto auto 1fr;
            column-gap: 24px;
            align-items: start;
            min-height: 420px;
        }

        .hero--3d > :not(.hero-3d) {
            grid-column: 1;
        }

        .hero-3d {
            grid-column: 2;
            grid-row: 1 / -1;
            position: relative;
            align-self: stretch;
            min-height: 380px;
            margin: -40px -20px -30px 0;
        }

        .hero-3d canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: pan-y;
        }

        .hero-3d.is-dragging canvas {
            cursor: grabbing;
        }

        .hero-3d-hint {
            position: absolute;
            right: 18px;
            bottom: 14px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-soft);
            background: #fff;
            border: 2px solid var(--border);
            padding: 4px 10px;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .hero-3d.is-dragging .hero-3d-hint {
            opacity: 0;
        }

        /* Tombol utama: blok hijau yang bisa ditekan */
        .btn-primary {
            transition: transform 0.25s var(--ease-3d), filter 0.2s ease, border-bottom-width 0.1s ease;
        }

        .hero .cta-btns .btn-primary:hover,
        .btn-primary:hover {
            transform: perspective(500px) rotateX(14deg) translate3d(0, -4px, 0) scale(1.05);
            filter: brightness(1.06) drop-shadow(0 10px 8px rgba(22, 163, 74, 0.35));
        }

        .hero .cta-btns .btn-primary:active,
        .btn-primary:active {
            transform: perspective(500px) translate3d(0, 4px, 0);
            border-bottom-width: 2px;
        }

        .btn-outline:hover {
            transform: perspective(500px) rotateY(-10deg) rotateZ(-1deg) translate3d(0, -2px, 0);
        }

        /* Kartu 3D: tilt mengikuti kursor, bayangan bergeser, kilau */
        .post-card,
        .contact-item,
        .skeleton-card {
            --rx: 0deg;
            --ry: 0deg;
            --lift: 0px;
            transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) rotateZ(var(--rz, 0deg)) translate3d(0, var(--lift), 0);
            box-shadow:
                var(--sx, 5px) var(--sy, 5px) 0 rgba(0, 0, 0, 0.08),
                calc(var(--sx, 5px) * 2) calc(var(--sy, 5px) * 2.4) 28px -8px rgba(20, 50, 80, 0.28);
            transition:
                transform 0.5s var(--ease-3d),
                box-shadow 0.5s var(--ease-3d),
                border-color 0.2s ease,
                opacity 0.7s ease var(--d, 0ms),
                translate 0.9s var(--ease-3d) var(--d, 0ms),
                rotate 0.9s var(--ease-3d) var(--d, 0ms);
            will-change: transform;
        }

        .post-card.is-tilting,
        .contact-item.is-tilting,
        .skeleton-card.is-tilting {
            transition:
                transform 0.12s linear,
                box-shadow 0.12s linear,
                border-color 0.2s ease,
                opacity 0.7s ease,
                translate 0.9s var(--ease-3d),
                rotate 0.9s var(--ease-3d);
        }

        .post-card::after,
        .contact-item::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 55%);
            opacity: 0;
            transition: opacity 0.3s ease;
            mix-blend-mode: soft-light;
        }

        .post-card.is-tilting::after,
        .contact-item.is-tilting::after {
            opacity: 1;
        }

        .post-category {
            box-shadow: 2px 2px 0 #a9c1dc;
        }

        .posts-grid,
        .contact-grid {
            perspective: 1400px;
        }

        /* Section title bergaya pita timbul */
        .section-title {
            text-shadow: 1px 1px 0 #fff, 2px 2px 0 var(--paper-edge);
        }

        /* Reveal 3D saat scroll */
        .r3d {
            opacity: 0;
            translate: 0 46px 0;
            rotate: x 26deg;
            transform-origin: 50% 0;
        }

        .r3d.r3d-in {
            opacity: 1;
            translate: 0 0 0;
            rotate: x 0deg;
        }

        .hero > .r3d,
        .section-title.r3d,
        .posts-toolbar.r3d,
        .page-content > .r3d {
            transition: opacity 0.7s ease var(--d, 0ms), translate 0.9s var(--ease-3d) var(--d, 0ms), rotate 0.9s var(--ease-3d) var(--d, 0ms);
        }

        .content-area {
            perspective: 1400px;
        }

        /* Modal: kartu yang berputar masuk */
        .modal {
            perspective: 1400px;
        }

        .modal.active {
            animation: modal-fade 0.3s ease both;
        }

        .modal.active .modal-content {
            animation: modal-3d 0.6s var(--ease-3d) both;
            box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.15), 0 40px 80px -20px rgba(15, 30, 50, 0.6);
        }

        @keyframes modal-fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes modal-3d {
            from {
                opacity: 0;
                transform: rotateX(-22deg) rotateY(6deg) translate3d(0, 60px, -160px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .modal-close {
            box-shadow: 0 4px 0 var(--border);
        }

        .modal-close:hover {
            transform: rotate(90deg) scale(1.05);
        }

        .modal-close:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--border);
        }

        @media (max-width: 900px) {
            .hero--3d {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                min-height: 0;
            }

            .hero-3d {
                grid-column: 1;
                grid-row: auto;
                min-height: 280px;
                margin: 16px 0 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container,
            .modal.active,
            .modal.active .modal-content {
                animation: none;
            }

            .post-card,
            .contact-item,
            .skeleton-card,
            .nav-links a,
            .nav-links button,
            .brand-icon,
            .btn-primary {
                transition: none;
            }
        }

        /* Bob corner widget — model transparan tanpa background */
        #bob-widget {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 190px;
            z-index: 900;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        #bob-widget[hidden] {
            display: none;
        }

        #bob-canvas {
            width: 100%;
            height: 220px;
            display: block;
            background: transparent;
            cursor: pointer;
        }

        #bob-bubble {
            position: relative;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.45;
            color: var(--ink);
            margin-bottom: 10px;
            max-height: 88px;
            overflow: hidden;
            pointer-events: none;
        }

        #bob-bubble::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -9px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-right: 2px solid var(--border);
            border-bottom: 2px solid var(--border);
            transform: translateX(-50%) rotate(45deg);
        }

        @media (max-width: 768px) {
            #bob-widget {
                width: 140px;
                right: 12px;
                bottom: 12px;
            }

            #bob-canvas {
                height: 160px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
            }

            .nav-links {
                gap: 15px;
                justify-content: center;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero {
                padding: 50px 20px 40px;
            }

            .content-area {
                padding: 25px 20px;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#content-area">Skip to content</a>
    <div class="checkered-bg" aria-hidden="true"></div>

    <div class="page-wrapper">
        <div class="container paper-panel">
            <nav class="navbar" aria-label="Main navigation">
                <div class="navbar-brand" id="nav-brand">
                    <img id="site-logo" class="site-logo paper-scrap" src="" alt="Site logo">
                    <span class="brand-icon paper-scrap" id="brand-fallback" aria-hidden="true">▣</span>
                    <span id="site-name">CMS</span>
                </div>
                <div class="nav-links" id="nav-links">
                    <button class="active" onclick="showHome()">Home</button>
                    <button onclick="showPosts()">Posts</button>
                    <button onclick="showContact()">Contact</button>
                    <button onclick="showAdminLink()" class="admin-link" id="nav-admin-btn">Admin</button>
                </div>
            </nav>

            <main class="content-area" id="content-area">
                <div class="loading">
                    <div class="spinner" role="status" aria-label="Loading"></div>
                    <p>Loading…</p>
                </div>
            </main>

            <footer class="footer" id="footer">
                <span id="footer-text">Powered by Davius</span>
                <nav aria-label="Footer">
                    <a href="#" onclick="showHome(); return false;">Home</a>
                    <a href="?posts" onclick="showPosts(); return false;">Posts</a>
                    <a href="admin.html">Admin</a>
                </nav>
            </footer>
        </div>
    </div>

    <!-- Bob corner mascot (muncul setelah assets/bob.glb tersedia) -->
    <div id="bob-widget" hidden>
        <div id="bob-bubble">…</div>
        <canvas id="bob-canvas" title="Klik untuk ganti animasi"></canvas>
    </div>

    <!-- Post Detail Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalPostTitle">Post</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <img id="modalPostImage" src="" alt="Post cover image" class="modal-image" style="display:none;">
            <div class="modal-body">
                <div id="modalPostCategory" class="post-category"></div>
                <div id="modalPostMeta" class="post-meta"></div>
                <div id="modalPostContent" class="page-content"></div>
                <div id="modalPostTags" class="tag-row"></div>
                <div class="comments-box" id="comments-box">
                    <h3>Comments</h3>
                    <div id="comments-list"></div>
                    <form class="comment-form" id="comment-form" onsubmit="return submitComment(event)">
                        <label for="comment-name">Name</label>
                        <input type="text" id="comment-name" placeholder="Your name" required maxlength="60">
                        <label for="comment-text">Comment</label>
                        <textarea id="comment-text" placeholder="Share your thoughts…" required maxlength="2000"></textarea>
                        <button type="submit" id="comment-btn">Post comment</button>
                        <p class="form-note" id="comment-note"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE + LOGIC -->
    <script type="module" src="js/index-app.js"></script>

    <!-- Lapisan 3D: background, pulau voxel di hero, tilt kartu, reveal -->
    <script type="module" src="js/index-3d.js"></script>

    <!-- Bob corner mascot: skeletal .glb dari Simitone Avatar Export -->
    <script type="module" src="js/index-bob.js"></script>
</body>

</html>
