<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Powered by Davius">
    <meta property="og:title" content="Davius">
    <meta property="og:description" content="Powered by Davius.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235488c0'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='white'%3ED%3C/text%3E%3C/svg%3E">
    <title>Davius</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --primary: #5488c0;
            --primary-d: #3f6da3;
            --bg-start: #a9c5e3;
            --bg-end: #4da6a9;
            --paper: #f4f1ea;
            --paper-edge: #e2dec9;
            --paper-blue: #cfe0f1;
            --ink: #334155;
            --ink-soft: #64748b;
            --accent: #4ade80;
            --accent-d: #16a34a;
            --card: #ffffff;
            --border: #cbd5e1;
            --radius: 4px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--ink);
            overflow-x: hidden;
            min-height: 100dvh;
            font-variant-numeric: tabular-nums;
        }

        .font-display {
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Checkered backdrop like reference */
        .checkered-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.1) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.1) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.1) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }

        /* Paper craft shapes */
        .paper-panel {
            clip-path: polygon(1% 2%, 98% 1%, 100% 98%, 2% 100%, 0% 50%);
        }

        .paper-scrap {
            clip-path: polygon(5% 0%, 95% 5%, 100% 90%, 92% 100%, 8% 95%, 0% 80%);
        }

        .wavy-button {
            clip-path: polygon(0% 20%, 15% 0%, 85% 10%, 100% 20%, 95% 80%, 80% 100%, 20% 90%, 0% 80%);
        }

        .hexagon {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }

        :focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .skip-link {
            position: absolute;
            left: -999px;
            top: 8px;
            background: var(--ink);
            color: #fff;
            padding: 10px 18px;
            font-weight: 700;
            z-index: 3000;
        }

        .skip-link:focus {
            left: 8px;
        }

        .admin-link {
            color: var(--ink-soft) !important;
        }

        .page-wrapper {
            padding: 28px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100dvh;
            position: relative;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--paper);
            border-right: 4px solid var(--paper-edge);
            border-bottom: 4px solid var(--paper-edge);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
        }

        .navbar {
            background: var(--paper);
            border-bottom: 3px dashed var(--paper-edge);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .navbar-brand {
            font-family: 'Fredoka One', cursive;
            font-size: 1.5rem;
            letter-spacing: 0.04em;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-transform: uppercase;
        }

        .brand-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: var(--primary);
            color: #fff;
            font-size: 1.4rem;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a,
        .nav-links button {
            color: var(--ink-soft);
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, color 0.2s ease, background 0.2s ease;
            padding: 8px 14px;
            font-size: 0.92rem;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .nav-links a:hover,
        .nav-links a.active,
        .nav-links button:hover,
        .nav-links button.active {
            color: var(--primary);
            background: var(--paper-blue);
        }

        .content-area {
            padding: 40px;
            min-height: 400px;
        }

        /* Hero */
        .hero {
            text-align: left;
            padding: 56px 12px 44px;
            position: relative;
            max-width: 68ch;
        }

        .hero h1 {
            font-family: 'Fredoka One', cursive;
            font-size: clamp(2.4rem, 5vw, 3.4rem);
            letter-spacing: 0.02em;
            line-height: 1.05;
            color: var(--ink);
            margin-bottom: 15px;
            text-wrap: balance;
            text-transform: uppercase;
        }

        .hero h1 .accent {
            color: var(--primary);
        }

        .hero p {
            color: var(--ink-soft);
            font-size: 1.1rem;
            max-width: 65ch;
            line-height: 1.7;
            font-weight: 600;
        }

        .hero .cta-btns {
            margin-top: 28px;
            display: flex;
            gap: 14px;
            justify-content: flex-start;
            flex-wrap: wrap;
            align-items: center;
        }

        .hero .cta-btns button,
        .hero .cta-btns a {
            padding: 14px 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease;
            text-decoration: none;
            font-family: inherit;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.05em;
            border-bottom: 6px solid var(--accent-d);
            text-transform: uppercase;
            clip-path: polygon(0% 20%, 15% 0%, 85% 10%, 100% 20%, 95% 80%, 80% 100%, 20% 90%, 0% 80%);
        }

        .btn-primary:hover {
            transform: scale(1.04);
            filter: brightness(1.05);
        }

        .hero .cta-btns button:active,
        .hero .cta-btns a:active,
        .btn-primary:active {
            transform: translateY(2px);
        }

        .btn-outline {
            background: #fff;
            color: var(--ink-soft);
            border: 2px solid var(--border) !important;
            font-weight: 700;
            clip-path: polygon(5% 0%, 95% 5%, 100% 90%, 92% 100%, 8% 95%, 0% 80%);
        }

        .btn-outline:hover {
            color: var(--primary);
            border-color: var(--primary) !important;
            transform: rotate(-1deg);
        }

        /* Section */
        .section-title {
            color: var(--ink-soft);
            font-weight: 700;
            font-size: 0.85rem;
            margin: 40px 0 22px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            padding-left: 8px;
        }

        /* Page Content */
        .page-content {
            color: var(--ink-soft);
            line-height: 1.9;
            font-size: 1rem;
            font-weight: 500;
        }

        .page-content h1,
        .page-content h2,
        .page-content h3 {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.02em;
            color: var(--ink);
            margin: 25px 0 15px;
            text-wrap: balance;
        }

        .page-content h1 {
            font-size: 2rem;
        }

        .page-content h2 {
            font-size: 1.5rem;
        }

        .page-content h3 {
            font-size: 1.2rem;
        }

        .page-content p {
            margin-bottom: 15px;
        }

        .page-content ul,
        .page-content ol {
            padding-left: 25px;
            margin-bottom: 15px;
        }

        .page-content li {
            margin-bottom: 8px;
        }

        .page-content a {
            color: var(--primary);
            font-weight: 700;
        }

        .page-content img {
            max-width: 100%;
            margin: 20px 0;
        }

        .page-content blockquote {
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            margin: 20px 0;
            background: var(--paper-blue);
        }

        /* Posts Grid — asymmetric: lead story spans two columns */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 20px;
        }

        @media (min-width: 900px) {
            .posts-grid .post-card:first-child {
                grid-column: span 2;
            }

            .posts-grid .post-card:first-child .post-image {
                height: 260px;
            }
        }

        .post-card {
            background: var(--card);
            border: 2px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 5px 5px 0px rgba(0, 0, 0, 0.08);
        }

        .post-card:nth-child(odd) {
            transform: rotate(-0.4deg);
        }

        .post-card:nth-child(even) {
            transform: rotate(0.4deg);
        }

        .post-card:hover {
            transform: rotate(0deg) translateY(-5px);
            border-color: var(--primary);
        }

        .post-image {
            height: 200px;
            background: var(--paper-blue);
            overflow: hidden;
            border-bottom: 2px solid var(--border);
        }

        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .post-card:hover .post-image img {
            transform: scale(1.06);
        }

        .post-info {
            padding: 22px;
        }

        .post-category {
            display: inline-block;
            background: var(--paper-blue);
            color: var(--primary-d);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 5px 12px;
            margin-bottom: 10px;
        }

        .post-title {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.02em;
            color: var(--ink);
            font-size: 1.15rem;
            margin-bottom: 8px;
            text-wrap: balance;
        }

        .post-excerpt {
            color: var(--ink-soft);
            font-size: 0.92rem;
            line-height: 1.6;
            max-width: 65ch;
            font-weight: 500;
        }

        /* Contact */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .contact-item {
            padding: 18px 20px;
            background: #fff;
            border: 2px solid var(--border);
            color: var(--ink-soft);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s ease;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.08);
        }

        .contact-item:hover {
            border-color: var(--primary);
            transform: rotate(-1deg);
        }

        .contact-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: var(--paper-blue);
            color: var(--primary-d);
            flex-shrink: 0;
        }

        /* Footer */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 22px 28px;
            border-top: 3px dashed var(--paper-edge);
            color: var(--ink-soft);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .footer nav {
            display: flex;
            gap: 18px;
        }

        .footer a {
            color: var(--ink-soft);
            text-decoration: none;
            font-weight: 700;
        }

        .footer a:hover {
            color: var(--primary);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(51, 65, 85, 0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--paper);
            border-right: 4px solid var(--paper-edge);
            border-bottom: 4px solid var(--paper-edge);
            width: 90%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.15);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 28px;
            border-bottom: 3px dashed var(--paper-edge);
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.02em;
            color: var(--ink);
            font-size: 1.4rem;
        }

        .modal-close {
            background: #fff;
            border: 2px solid var(--border);
            color: var(--ink-soft);
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, color 0.2s ease;
            font-family: inherit;
        }

        .modal-close:hover {
            color: var(--primary);
            border-color: var(--primary);
            transform: rotate(90deg);
        }

        .modal-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }

        .modal-body {
            padding: 30px;
        }

        .modal-body .post-category {
            margin-bottom: 10px;
        }

        .modal-body .page-content {
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--ink-soft);
            font-weight: 600;
        }

        /* Skeleton loader matching card shape */
        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 20px;
        }

        .skeleton-card {
            border: 2px solid var(--border);
            overflow: hidden;
            background: #fff;
        }

        .skeleton-block {
            background: linear-gradient(90deg, var(--paper-edge) 25%, #fff 50%, var(--paper-edge) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .spinner {
            border: 4px solid var(--paper-edge);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--paper-edge);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
        }

        /* Posts toolbar: search + category filter */
        .posts-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 20px 0 6px;
        }

        .posts-toolbar input,
        .posts-toolbar select {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--border);
            padding: 10px 14px;
        }

        .posts-toolbar input {
            flex: 1;
            min-width: 200px;
        }

        .posts-toolbar input:focus,
        .posts-toolbar select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .post-meta {
            color: var(--ink-soft);
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .tag-chip {
            background: #fff;
            border: 2px solid var(--border);
            color: var(--ink-soft);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
        }

        .site-logo {
            height: 40px;
            width: auto;
            display: none;
        }

        /* Comments */
        .comments-box {
            margin-top: 28px;
            border-top: 3px dashed var(--paper-edge);
            padding-top: 20px;
        }

        .comments-box h3 {
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.03em;
            font-size: 1.1rem;
            color: var(--ink);
            margin-bottom: 14px;
        }

        .comment-item {
            background: #fff;
            border: 2px solid var(--border);
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .comment-item .comment-head {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary-d);
            margin-bottom: 4px;
        }

        .comment-item .comment-date {
            font-weight: 600;
            color: var(--ink-soft);
        }

        .comment-item p {
            color: var(--ink-soft);
            font-size: 0.92rem;
            line-height: 1.6;
            margin: 0;
        }

        .comment-form label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 12px 0 6px;
        }

        .comment-form input,
        .comment-form textarea {
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--ink);
            background: #fff;
            border: 2px solid var(--border);
            padding: 10px 14px;
        }

        .comment-form input:focus,
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .comment-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .comment-form button {
            margin-top: 12px;
            padding: 12px 26px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-bottom: 5px solid var(--accent-d);
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .comment-form button:hover { transform: scale(1.03); }
        .comment-form button:disabled { opacity: 0.6; cursor: wait; transform: none; }

        .form-note {
            font-size: 0.82rem;
            color: var(--ink-soft);
            margin-top: 10px;
            display: none;
        }

        /* Bob corner widget — model transparan tanpa background */
        #bob-widget {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 190px;
            z-index: 900;
            background: transparent;
            border: none;
            box-shadow: none;
        }

        #bob-widget[hidden] {
            display: none;
        }

        #bob-canvas {
            width: 100%;
            height: 220px;
            display: block;
            background: transparent;
            cursor: pointer;
        }

        #bob-bubble {
            position: relative;
            background: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            line-height: 1.45;
            color: var(--ink);
            margin-bottom: 10px;
            max-height: 88px;
            overflow: hidden;
            pointer-events: none;
        }

        #bob-bubble::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -9px;
            width: 14px;
            height: 14px;
            background: #fff;
            border-right: 2px solid var(--border);
            border-bottom: 2px solid var(--border);
            transform: translateX(-50%) rotate(45deg);
        }

        @media (max-width: 768px) {
            #bob-widget {
                width: 140px;
                right: 12px;
                bottom: 12px;
            }

            #bob-canvas {
                height: 160px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
                flex-direction: column;
            }

            .nav-links {
                gap: 15px;
                justify-content: center;
            }

            .hero h1 {
                font-size: 2rem;
            }

            .hero {
                padding: 50px 20px 40px;
            }

            .content-area {
                padding: 25px 20px;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <a class="skip-link" href="#content-area">Skip to content</a>
    <div class="checkered-bg" aria-hidden="true"></div>

    <div class="page-wrapper">
        <div class="container paper-panel">
            <nav class="navbar" aria-label="Main navigation">
                <div class="navbar-brand" id="nav-brand">
                    <img id="site-logo" class="site-logo paper-scrap" src="" alt="Site logo">
                    <span class="brand-icon paper-scrap" id="brand-fallback" aria-hidden="true">▣</span>
                    <span id="site-name">CMS</span>
                </div>
                <div class="nav-links" id="nav-links">
                    <button class="active" onclick="showHome()">Home</button>
                    <button onclick="showPosts()">Posts</button>
                    <button onclick="showContact()">Contact</button>
                    <button onclick="showAdminLink()" class="admin-link" id="nav-admin-btn">Admin</button>
                </div>
            </nav>

            <main class="content-area" id="content-area">
                <div class="loading">
                    <div class="spinner" role="status" aria-label="Loading"></div>
                    <p>Loading…</p>
                </div>
            </main>

            <footer class="footer" id="footer">
                <span id="footer-text">Powered by Davius</span>
                <nav aria-label="Footer">
                    <a href="#" onclick="showHome(); return false;">Home</a>
                    <a href="?posts" onclick="showPosts(); return false;">Posts</a>
                    <a href="admin.html">Admin</a>
                </nav>
            </footer>
        </div>
    </div>

    <!-- Bob corner mascot (muncul setelah assets/bob.glb tersedia) -->
    <div id="bob-widget" hidden>
        <div id="bob-bubble">…</div>
        <canvas id="bob-canvas" title="Klik untuk ganti animasi"></canvas>
    </div>

    <!-- Post Detail Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalPostTitle">Post</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <img id="modalPostImage" src="" alt="Post cover image" class="modal-image" style="display:none;">
            <div class="modal-body">
                <div id="modalPostCategory" class="post-category"></div>
                <div id="modalPostMeta" class="post-meta"></div>
                <div id="modalPostContent" class="page-content"></div>
                <div id="modalPostTags" class="tag-row"></div>
                <div class="comments-box" id="comments-box">
                    <h3>Comments</h3>
                    <div id="comments-list"></div>
                    <form class="comment-form" id="comment-form" onsubmit="return submitComment(event)">
                        <label for="comment-name">Name</label>
                        <input type="text" id="comment-name" placeholder="Your name" required maxlength="60">
                        <label for="comment-text">Comment</label>
                        <textarea id="comment-text" placeholder="Share your thoughts…" required maxlength="2000"></textarea>
                        <button type="submit" id="comment-btn">Post comment</button>
                        <p class="form-note" id="comment-note"></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE + LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, getDocs, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- FIREBASE CONFIG (PLACEHOLDER) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDxqQOEuFjIR2W9-lrtAjaYsqPMHa8-6X4",
            authDomain: "jimmy-27ea1.firebaseapp.com",
            databaseURL: "https://jimmy-27ea1.firebaseio.com",
            projectId: "jimmy-27ea1",
            storageBucket: "jimmy-27ea1.appspot.com",
            messagingSenderId: "1053115589398",
            appId: "1:1053115589398:web:f8f300891ea3c2d81be637",
            measurementId: "G-0VV0WP7VZ3"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let settings = {};
        let allPages = [];
        let allPosts = [];
        let commentCounts = {};

        function tsMillis(v) {
            if (v == null) return 0;
            if (typeof v.toMillis === 'function') return v.toMillis();
            if (typeof v.toDate === 'function') return v.toDate().getTime();
            if (typeof v === 'object' && typeof v.seconds === 'number') return v.seconds * 1000;
            const t = new Date(v).getTime();
            return isNaN(t) ? 0 : t;
        }
        function fmtDate(v) {
            const ms = tsMillis(v);
            if (!ms) return '';
            return new Date(ms).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }
        function setSeo(title, desc) {
            document.title = title;
            const setMeta = (sel, attr, val) => {
                const el = document.querySelector(sel);
                if (el) el.setAttribute(attr, val);
            };
            setMeta('meta[name="description"]', 'content', desc);
            setMeta('meta[property="og:title"]', 'content', title);
            setMeta('meta[property="og:description"]', 'content', desc);
        }

        // --- DATA LOADING ---
        async function loadAll() {
            try {
                const settingsSnap = await getDoc(doc(db, "settings", "general"));
                if (settingsSnap.exists()) {
                    settings = settingsSnap.data();
                    document.getElementById('site-name').textContent = settings.siteName || 'CMS';
                    document.getElementById('footer-text').textContent = settings.footerText || 'Powered by Davius';
                    document.title = settings.siteName || 'CMS';
                    const logo = document.getElementById('site-logo');
                    if (settings.logo && typeof settings.logo === 'string') {
                        logo.src = settings.logo;
                        logo.alt = (settings.siteName || 'Site') + ' logo';
                        logo.style.display = 'block';
                        document.getElementById('brand-fallback').style.display = 'none';
                    }
                }

                const pagesQuery = query(collection(db, "pages"), where("status", "==", "published"));
                const pagesSnap = await getDocs(pagesQuery);
                allPages = [];
                pagesSnap.forEach(d => allPages.push({ id: d.id, ...d.data() }));
                allPages.sort((a, b) => (a.title || '').localeCompare(b.title || ''));

                renderNav();

                // URL routing
                routeFromURL();
            } catch (e) {
                console.error(e);
                document.getElementById('content-area').innerHTML = '<div class="loading"><p>Error loading data.</p></div>';
            }
        }

        // Navigation from Menu settings (admin > Menus), fallback to legacy auto-nav
        function renderNav() {
            const navContainer = document.getElementById('nav-links');
            const adminBtn = document.getElementById('nav-admin-btn');
            // Rebuild from scratch so static buttons never duplicate appended ones
            navContainer.querySelectorAll('button').forEach(b => { if (b !== adminBtn) b.remove(); });
            const addBtn = (label, onclick) => {
                const btn = document.createElement('button');
                btn.textContent = label;
                btn.onclick = onclick;
                navContainer.insertBefore(btn, adminBtn);
            };
            const menu = Array.isArray(settings.menu) ? settings.menu : null;
            if (menu && menu.length) {
                menu.forEach(item => {
                    if (!item || item.hidden) return;
                    const label = item.label || 'Link';
                    if (item.kind === 'home') addBtn(label, () => showHome());
                    else if (item.kind === 'posts') addBtn(label, () => showPosts());
                    else if (item.kind === 'contact') addBtn(label, () => showContact());
                    else if (item.kind === 'page' && item.slug) addBtn(label, () => showPage(item.slug));
                    else if (item.kind === 'custom' && item.url) addBtn(label, () => window.open(item.url, '_blank', 'noopener'));
                });
            } else {
                addBtn('Home', () => showHome());
                addBtn('Posts', () => showPosts());
                addBtn('Contact', () => showContact());
                allPages.forEach(page => addBtn(page.title, () => showPage(page.slug)));
            }
        }

        // --- CONTENT NORMALIZERS ---
        // Firestore `content`/`excerpt` may be stored as a map (e.g. Quill Delta
        // {ops:[...]} or {html:...}) instead of a string. Rendering such values
        // directly produces "[object Object]".
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function deltaToHtml(delta) {
            if (!delta || !Array.isArray(delta.ops)) return '';
            const text = delta.ops.map(op => typeof op.insert === 'string' ? op.insert : '').join('');
            return text.split('\n').map(line => line.trim() ? `<p>${escapeHtml(line)}</p>` : '').join('');
        }
        function richToHtml(value) {
            if (value == null) return '';
            if (typeof value === 'string') return value;
            if (Array.isArray(value)) return value.map(richToHtml).join('');
            if (typeof value === 'object') {
                if (Array.isArray(value.ops)) return deltaToHtml(value);
                for (const k of ['html', 'content', 'text', 'body', 'value']) {
                    if (value[k] !== undefined) return richToHtml(value[k]);
                }
                return '';
            }
            return String(value);
        }
        function plainText(value) {
            const tmp = document.createElement('div');
            tmp.innerHTML = richToHtml(value);
            return (tmp.textContent || '').trim();
        }

        // --- VIEWS ---
        window.showHome = () => {
            history.pushState(null, '', window.location.pathname);
            const area = document.getElementById('content-area');
            let pageLinks = '';
            allPages.slice(0, 4).forEach(p => {
                pageLinks += `<button class="btn btn-outline" onclick="showPage('${p.slug}')">${p.title}</button>`;
            });
            area.innerHTML = `
                <div class="hero">
                    <h1>${(settings.siteName || 'Welcome').replace(/(\S+)$/, '<span class="accent">$1</span>')}</h1>
                    <p>${settings.siteDescription || 'Content Management System powered by Firebase.'}</p>
                    <div class="cta-btns">
                        <button class="btn-primary" onclick="showPosts()">Browse posts</button>
                        ${pageLinks}
                    </div>
                </div>
            `;
            document.title = settings.siteName || 'CMS';
            setActiveNav(0);
        };

        window.showPosts = async () => {
            history.pushState(null, '', '?posts');
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="skeleton-grid" aria-hidden="true">' + '<div class="skeleton-card"><div class="skeleton-block" style="height:180px"></div><div style="padding:20px"><div class="skeleton-block" style="height:14px;width:40%;margin-bottom:10px"></div><div class="skeleton-block" style="height:18px;margin-bottom:8px"></div><div class="skeleton-block" style="height:14px;width:80%"></div></div></div>'.repeat(3) + '</div>';
            try {
                const q = query(collection(db, "posts"), where("status", "==", "published"));
                const snap = await getDocs(q);
                if (snap.empty) {
                    area.innerHTML = '<div class="hero"><h1>No posts yet</h1><p>New stories will appear here once published.</p><div class="cta-btns"><button class="btn-primary" onclick="showHome()">Back home</button></div></div>';
                    return;
                }
                allPosts = [];
                snap.forEach(d => allPosts.push({ id: d.id, ...d.data() }));
                // Newest first (WordPress-style), undated last
                allPosts.sort((a, b) => (tsMillis(b.createdAt) || tsMillis(b.updatedAt)) - (tsMillis(a.createdAt) || tsMillis(a.updatedAt)));

                // Approved comment counts in one query
                commentCounts = {};
                try {
                    const csnap = await getDocs(query(collection(db, "comments"), where("status", "==", "approved")));
                    csnap.forEach(d => {
                        const pid = d.data().postId;
                        if (pid) commentCounts[pid] = (commentCounts[pid] || 0) + 1;
                    });
                } catch (e) { console.warn('comments count failed', e); }

                const cats = [...new Set(allPosts.map(p => plainText(p.category) || 'General'))].sort();
                area.innerHTML = `
                    <div class="section-title">Latest posts</div>
                    <div class="posts-toolbar">
                        <input type="search" id="post-search" placeholder="Search posts…" aria-label="Search posts" oninput="applyPostFilter()">
                        <select id="post-cat" aria-label="Filter by category" onchange="applyPostFilter()">
                            <option value="">All categories</option>
                            ${cats.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="posts-grid" id="posts-grid"></div>
                `;
                applyPostFilter();
                setSeo(`Posts - ${settings.siteName || 'CMS'}`, `Browse posts on ${settings.siteName || 'CMS'}.`);
                setActiveNav(1);
            } catch (e) {
                area.innerHTML = '<div class="hero"><h1>Could not load posts</h1><p>Check your connection and try again.</p><div class="cta-btns"><button class="btn-primary" onclick="showPosts()">Retry</button><button class="btn-outline" onclick="showHome()">Back home</button></div></div>';
            }
        };

        window.applyPostFilter = () => {
            const grid = document.getElementById('posts-grid');
            if (!grid) return;
            const term = (document.getElementById('post-search')?.value || '').toLowerCase().trim();
            const cat = document.getElementById('post-cat')?.value || '';
            const posts = allPosts.filter(p => {
                const title = plainText(p.title);
                const body = plainText(p.content);
                const excerpt = plainText(p.excerpt);
                const category = plainText(p.category) || 'General';
                const tags = plainText(p.tags);
                if (cat && category !== cat) return false;
                if (term && !(title + ' ' + body + ' ' + excerpt + ' ' + tags).toLowerCase().includes(term)) return false;
                return true;
            });
            if (!posts.length) {
                grid.innerHTML = '<div class="hero" style="grid-column:1/-1;"><h1>No matches</h1><p>Try a different keyword or category.</p></div>';
                return;
            }
            let html = '';
            posts.forEach(p => {
                const bodyText = plainText(p.content);
                const excerptText = plainText(p.excerpt) || (bodyText ? bodyText.slice(0, 97) + '…' : 'No excerpt available.');
                const categoryText = plainText(p.category) || 'General';
                const authorText = plainText(p.author);
                const dateText = fmtDate(p.createdAt || p.updatedAt);
                const cc = commentCounts[p.id] || 0;
                const meta = [authorText, dateText, cc ? `${cc} comment${cc > 1 ? 's' : ''}` : ''].filter(Boolean).join(' · ');
                html += `
                    <article class="post-card" onclick="openPostModal('${p.id}')">
                        <div class="post-image">
                            <img src="${typeof p.image === 'string' && p.image ? p.image : 'https://picsum.photos/seed/' + p.id + '/800/500'}" alt="${escapeHtml(plainText(p.title) || 'Post')}" loading="lazy">
                        </div>
                        <div class="post-info">
                            <div class="post-category">${escapeHtml(categoryText)}</div>
                            <div class="post-title">${escapeHtml(plainText(p.title) || 'Untitled')}</div>
                            ${meta ? `<div class="post-meta">${escapeHtml(meta)}</div>` : ''}
                            <div class="post-excerpt">${escapeHtml(excerptText)}</div>
                        </div>
                    </article>
                `;
            });
            grid.innerHTML = html;
            gsap.from('.post-card', { opacity: 0, y: 24, duration: 0.45, stagger: 0.06, ease: "power2.out", clearProps: "all" });
        };

        window.showPage = async (slug) => {
            history.pushState(null, '', `?page=${slug}`);
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const page = allPages.find(p => p.slug === slug);
                if (page) {
                    area.innerHTML = `
                        <p style="margin-bottom:12px;"><button class="btn-outline" style="padding:8px 16px;" onclick="showHome()">← Back home</button></p>
                        <h1 class="font-display" style="color:var(--ink);font-size:clamp(1.6rem,3vw,2.2rem);margin-bottom:20px;text-wrap:balance;text-transform:uppercase;letter-spacing:0.02em;">${page.title}</h1>
                        <div class="page-content">${richToHtml(page.content) || '<p>No content.</p>'}</div>
                    `;
                    setSeo(`${page.title} - ${settings.siteName || 'CMS'}`, plainText(page.content).slice(0, 155));
                    setActiveNav(-1);
                } else {
                    area.innerHTML = '<div class="hero"><h1>Page not found</h1><p>The page you asked for does not exist or is unpublished.</p><div class="cta-btns"><button class="btn-primary" onclick="showHome()">Back home</button><button class="btn-outline" onclick="showPosts()">Browse posts</button></div></div>';
                }
            } catch (e) {
                area.innerHTML = '<div class="hero"><h1>Could not load page</h1><p>Check your connection and try again.</p><div class="cta-btns"><button class="btn-primary" onclick="showHome()">Back home</button></div></div>';
            }
        };

        window.showContact = () => {
            history.pushState(null, '', '?contact');
            const area = document.getElementById('content-area');
            area.innerHTML = `
                <div class="section-title">Contact</div>
                <div class="contact-grid">
                    ${settings.contactEmail ? `<div class="contact-item"><span class="contact-icon material-symbols-outlined" aria-hidden="true">mail</span> <a href="mailto:${settings.contactEmail}" style="color:var(--ink);text-decoration:none;">${settings.contactEmail}</a></div>` : ''}
                    <div class="contact-item"><span class="contact-icon material-symbols-outlined" aria-hidden="true">storefront</span> ${settings.siteName || 'CMS'}</div>
                </div>
            `;
            setSeo(`Contact - ${settings.siteName || 'CMS'}`, `Contact ${settings.siteName || 'CMS'}.`);
            setActiveNav(2);
        };

        window.showAdminLink = () => {
            window.location.href = 'admin.html';
        };

        // --- MODAL ---
        let currentPostId = null;
        window.openPostModal = async (id) => {
            history.pushState(null, '', `?post=${id}`);
            currentPostId = id;
            try {
                const snap = await getDoc(doc(db, "posts", id));
                if (!snap.exists()) return;
                const p = snap.data();
                const title = plainText(p.title) || 'Post';
                document.getElementById('modalPostTitle').textContent = title;
                document.getElementById('modalPostCategory').textContent = plainText(p.category);
                const meta = [plainText(p.author), fmtDate(p.createdAt || p.updatedAt)].filter(Boolean).join(' · ');
                document.getElementById('modalPostMeta').textContent = meta;
                document.getElementById('modalPostContent').innerHTML = richToHtml(p.content);
                const tags = plainText(p.tags).split(',').map(t => t.trim()).filter(Boolean);
                document.getElementById('modalPostTags').innerHTML = tags.map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
                const desc = plainText(p.metaDesc) || plainText(p.excerpt) || plainText(p.content).slice(0, 155);
                setSeo(`${title} - ${settings.siteName || 'CMS'}`, desc);
                const img = document.getElementById('modalPostImage');
                const imgSrc = typeof p.image === 'string' ? p.image : '';
                if (imgSrc) {
                    img.src = imgSrc;
                    img.alt = title;
                    img.style.display = 'block';
                } else {
                    img.removeAttribute('src');
                    img.style.display = 'none';
                }
                document.getElementById('comment-note').style.display = 'none';
                document.getElementById('postModal').classList.add('active');
                loadComments(id);
            } catch (e) { console.error(e); }
        };

        async function loadComments(postId) {
            const list = document.getElementById('comments-list');
            list.innerHTML = '<div class="loading" style="padding:20px;">Loading comments…</div>';
            try {
                const snap = await getDocs(query(collection(db, "comments"), where("postId", "==", postId), where("status", "==", "approved")));
                const items = [];
                snap.forEach(d => items.push({ id: d.id, ...d.data() }));
                items.sort((a, b) => tsMillis(a.createdAt) - tsMillis(b.createdAt));
                if (!items.length) {
                    list.innerHTML = '<p style="color:var(--ink-soft);font-size:0.9rem;">No comments yet. Be the first to comment.</p>';
                    return;
                }
                list.innerHTML = items.map(c => `
                    <div class="comment-item">
                        <div class="comment-head">${escapeHtml(plainText(c.name) || 'Anonymous')} <span class="comment-date">· ${escapeHtml(fmtDate(c.createdAt) || '')}</span></div>
                        <p>${escapeHtml(plainText(c.text))}</p>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                list.innerHTML = '';
            }
        }

        window.submitComment = async (e) => {
            e.preventDefault();
            const nameEl = document.getElementById('comment-name');
            const textEl = document.getElementById('comment-text');
            const btn = document.getElementById('comment-btn');
            const note = document.getElementById('comment-note');
            const name = nameEl.value.trim();
            const text = textEl.value.trim();
            if (!name || !text || !currentPostId) return false;
            btn.disabled = true;
            try {
                await addDoc(collection(db, "comments"), { postId: currentPostId, name, text, status: "pending", createdAt: serverTimestamp() });
                nameEl.value = '';
                textEl.value = '';
                note.textContent = 'Thanks! Your comment is awaiting moderation.';
                note.style.display = 'block';
            } catch (err) {
                console.error(err);
                note.textContent = 'Could not post comment. Try again.';
                note.style.display = 'block';
            } finally {
                btn.disabled = false;
            }
            return false;
        };

        window.closeModal = () => {
            document.getElementById('postModal').classList.remove('active');
            history.pushState(null, '', '?posts');
        };
        document.getElementById('postModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        function setActiveNav(index) {
            const buttons = document.querySelectorAll('#nav-links button');
            buttons.forEach((btn, i) => btn.classList.toggle('active', i === index));
        }

        // --- URL ROUTING ---
        function routeFromURL() {
            const params = new URLSearchParams(window.location.search);
            const pageSlug = params.get('page');
            const postId = params.get('post');
            const showPostsPage = params.has('posts');
            const showContactPage = params.has('contact');

            if (pageSlug) showPage(pageSlug);
            else if (showPostsPage) showPosts();
            else if (showContactPage) showContact();
            else if (postId) { showPosts(); setTimeout(() => openPostModal(postId), 300); }
            else showHome();
        }

        window.addEventListener('popstate', routeFromURL);

        // --- INIT ---
        window.addEventListener('load', () => {
            loadAll();
        });
    </script>

    <!-- Bob corner mascot: skeletal .glb dari Simitone Avatar Export -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        (async () => {
            const widget = document.getElementById('bob-widget');
            const canvas = document.getElementById('bob-canvas');
            const bubble = document.getElementById('bob-bubble');
            // Bubble chat: random advice dari Advice Slip API
            const loadAdvice = async () => {
                try {
                    const res = await fetch('https://api.adviceslip.com/advice', { cache: 'no-store' });
                    const data = await res.json();
                    const advice = data?.slip?.advice;
                    if (advice && bubble) bubble.textContent = '\u201C' + advice + '\u201D';
                } catch (e) {
                    if (bubble && !bubble.textContent) bubble.textContent = '\u201CHello!\u201D';
                }
            };
            try {
                const gltf = await new GLTFLoader().loadAsync('assets/bob.glb');
                const model = gltf.scene;
                const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                const scene = new THREE.Scene();
                scene.add(new THREE.AmbientLight(0xffffff, 1.1));
                const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
                sun.position.set(2, 4, 3);
                scene.add(sun);

                const group = new THREE.Group();
                group.add(model);
                scene.add(group);

                // Frame model
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3());
                const center = box.getCenter(new THREE.Vector3());
                group.position.sub(center);
                group.position.y += size.y / 2;
                const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
                const dist = (size.y || 1.7) * 2.1;
                camera.position.set(0.35, size.y * 0.55, dist);
                camera.lookAt(0, size.y * 0.48, 0);

                const resize = () => {
                    const w = canvas.clientWidth || 190;
                    const h = canvas.clientHeight || 220;
                    renderer.setSize(w, h, false);
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                };
                resize();
                window.addEventListener('resize', resize);

                // Animations: model saja, ganti otomatis tiap ada aktivitas halaman
                const mixer = new THREE.AnimationMixer(model);
                const clips = gltf.animations || [];
                let idx = 0;
                const play = (i) => {
                    mixer.stopAllAction();
                    if (!clips.length) return;
                    idx = ((i % clips.length) + clips.length) % clips.length;
                    mixer.clipAction(clips[idx]).setLoop(THREE.LoopRepeat, Infinity).play();
                };
                play(0);
                loadAdvice();
                setInterval(loadAdvice, 15000);
                canvas.addEventListener('click', () => { play(idx + 1); loadAdvice(); });

                // Trigger ganti animasi: hanya saat klik link menu
                let lastTrigger = 0;
                const triggerNext = () => {
                    if (clips.length < 2) return;
                    const now = performance.now();
                    if (now - lastTrigger < 1200) return;
                    lastTrigger = now;
                    play(idx + 1);
                    loadAdvice();
                };
                document.getElementById('nav-links')?.addEventListener('click', (e) => {
                    if (e.target.closest('button')) triggerNext();
                });

                widget.hidden = false;
                const clock = new THREE.Clock();
                renderer.setAnimationLoop(() => {
                    const dt = Math.min(clock.getDelta(), 0.1);
                    mixer.update(dt);
                    group.rotation.y += dt * 0.4;
                    renderer.render(scene, camera);
                });
            } catch (e) {
                // assets/bob.glb belum ada (belum export) — widget tetap sembunyi
                console.warn('[bob] widget off:', e?.message || e);
            }
        })();
    </script>
</body>

</html>
