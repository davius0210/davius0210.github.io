<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CMS Powered by Firebase">
    <title>CMS - Firebase</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap');
        :root {
            --green: #76ff03;
            --green-d: #64dd17;
            --blue: #29b6f6;
            --purple: #d946ef;
            --orange: #ff9800;
            --red: #f44336;
            --bg: #0a0e27;
            --panel: #1a2240;
            --surface: #232d4a;
            --text: #ffffff;
            --text2: #b0b9c6;
            --bar: #2a3d5a;
            --border: #3a4d6a;
            --glow-g: rgba(118,255,3,0.6);
            --glow-b: rgba(41,182,246,0.6);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f2e4d 100%);
            background-attachment: fixed;
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }
        #three-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }
        .particles-container {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2; pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(118,255,3,0.1);
            box-shadow: 0 0 10px rgba(118,255,3,0.3);
        }
        .page-wrapper {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: rgba(26,34,64,0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(58,77,106,0.5);
            border-radius: 25px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 50px var(--glow-g), 0 0 30px var(--glow-b);
            overflow: hidden;
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(118,255,3,0.05), transparent);
            z-index: -1; pointer-events: none;
        }
        .navbar {
            background: linear-gradient(90deg, rgba(26,34,64,0.9), rgba(26,34,64,0.7));
            border-bottom: 1px solid rgba(58,77,106,0.6);
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--green), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .brand-icon {
            font-size: 1.8rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-links a, .nav-links button {
            color: var(--text2);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            padding: 8px 0;
            font-size: 0.95rem;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            position: relative;
        }
        .nav-links a:hover, .nav-links a.active, .nav-links button:hover {
            color: var(--green);
            text-shadow: 0 0 15px var(--glow-g);
        }
        .nav-links a::before, .nav-links button::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            width: 0; height: 3px;
            background: linear-gradient(90deg, var(--green), var(--blue));
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .nav-links a:hover::before, .nav-links button:hover::before { width: 100%; }

        .content-area { padding: 40px; min-height: 400px; }

        /* Hero */
        .hero {
            text-align: center;
            padding: 80px 20px 60px;
            position: relative;
        }
        .hero h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--green), var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        .hero p {
            color: var(--text2);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }
        .hero .cta-btns {
            margin-top: 35px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .hero .cta-btns button, .hero .cta-btns a {
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: inherit;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--green), var(--green-d));
            color: #000;
            box-shadow: 0 5px 20px rgba(118,255,3,0.4);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(118,255,3,0.6); }
        .btn-outline {
            background: transparent;
            color: var(--green);
            border: 2px solid var(--green) !important;
        }
        .btn-outline:hover { background: var(--green); color: #000; }

        /* Section */
        .section-title {
            background: linear-gradient(90deg, rgba(118,255,3,0.2), transparent);
            border-left: 4px solid var(--green);
            color: var(--green);
            padding: 12px 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1rem;
            margin: 40px 0 25px;
            letter-spacing: 2px;
            border-radius: 0 8px 8px 0;
        }

        /* Page Content */
        .page-content {
            color: var(--text2);
            line-height: 1.9;
            font-size: 1rem;
        }
        .page-content h1, .page-content h2, .page-content h3 {
            color: var(--green);
            margin: 25px 0 15px;
        }
        .page-content h1 { font-size: 2rem; }
        .page-content h2 { font-size: 1.5rem; }
        .page-content h3 { font-size: 1.2rem; }
        .page-content p { margin-bottom: 15px; }
        .page-content ul, .page-content ol { padding-left: 25px; margin-bottom: 15px; }
        .page-content li { margin-bottom: 8px; }
        .page-content a { color: var(--blue); }
        .page-content img { max-width: 100%; border-radius: 12px; margin: 20px 0; }
        .page-content blockquote {
            border-left: 4px solid var(--green);
            padding: 15px 20px;
            margin: 20px 0;
            background: rgba(118,255,3,0.05);
            border-radius: 0 10px 10px 0;
        }

        /* Posts Grid */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        .post-card {
            background: linear-gradient(135deg, rgba(35,45,74,0.8), rgba(26,34,64,0.6));
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .post-card:hover {
            transform: translateY(-8px);
            border-color: var(--green);
            box-shadow: 0 15px 40px rgba(118,255,3,0.2);
        }
        .post-image {
            height: 200px;
            background: linear-gradient(135deg, var(--bar), #1e2a47);
            overflow: hidden;
        }
        .post-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .post-card:hover .post-image img { transform: scale(1.1); }
        .post-info { padding: 22px; }
        .post-category {
            color: var(--purple);
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .post-title {
            color: var(--green);
            font-weight: 900;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }
        .post-excerpt {
            color: var(--text2);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* Contact */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .contact-item {
            padding: 20px;
            background: rgba(35,45,74,0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text2);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .contact-item:hover {
            border-color: var(--green);
            transform: translateX(5px);
        }
        .contact-icon { font-size: 1.5rem; }

        /* Footer */
        .footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid rgba(58,77,106,0.5);
            color: var(--text2);
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: linear-gradient(135deg, rgba(26,34,64,0.95), rgba(35,45,74,0.95));
            border: 2px solid var(--border);
            border-radius: 20px;
            width: 90%;
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 60px var(--glow-g), 0 0 40px var(--glow-b);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            border-bottom: 2px solid var(--border);
            background: linear-gradient(90deg, rgba(118,255,3,0.1), transparent);
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .modal-title { color: var(--green); font-size: 1.6rem; font-weight: 900; }
        .modal-close {
            background: rgba(118,255,3,0.1);
            border: 2px solid var(--green);
            color: var(--green);
            font-size: 1.8rem;
            cursor: pointer;
            width: 45px;
            height: 45px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .modal-close:hover { background: var(--green); color: #000; transform: rotate(90deg); }
        .modal-image {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            display: block;
        }
        .modal-body { padding: 30px; }
        .modal-body .post-category { margin-bottom: 10px; }
        .modal-body .page-content { margin-top: 15px; }

        .loading { text-align: center; padding: 60px 20px; color: var(--text2); }
        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--green);
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(42,61,90,0.3); border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--green), var(--blue)); border-radius: 5px; }

        @media (max-width: 768px) {
            .navbar { padding: 15px 20px; flex-direction: column; }
            .nav-links { gap: 15px; justify-content: center; }
            .hero h1 { font-size: 2rem; }
            .hero { padding: 50px 20px 40px; }
            .content-area { padding: 25px 20px; }
            .posts-grid { grid-template-columns: 1fr; }
            .contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="three-bg"></div>
    <div class="particles-container" id="particles"></div>

    <div class="page-wrapper">
        <div class="container">
            <div class="navbar">
                <div class="navbar-brand" id="nav-brand">
                    <span class="brand-icon">📦</span>
                    <span id="site-name">CMS</span>
                </div>
                <div class="nav-links" id="nav-links">
                    <button class="active" onclick="showHome()">Home</button>
                    <button onclick="showPosts()">Posts</button>
                    <button onclick="showContact()">Contact</button>
                    <button onclick="showAdminLink()" style="color:var(--purple);">Admin</button>
                </div>
            </div>

            <div class="content-area" id="content-area">
                <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
            </div>

            <div class="footer" id="footer">
                <span id="footer-text">Powered by Firebase CMS</span>
            </div>
        </div>
    </div>

    <!-- Post Detail Modal -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalPostTitle">Post</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <img id="modalPostImage" src="" alt="" class="modal-image" style="display:none;">
            <div class="modal-body">
                <div id="modalPostCategory" class="post-category"></div>
                <div id="modalPostContent" class="page-content"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxqQOEuFjIR2W9-lrtAjaYsqPMHa8-6X4",
            authDomain: "jimmy-27ea1.firebaseapp.com",
            databaseURL: "https://jimmy-27ea1.firebaseio.com",
            projectId: "jimmy-27ea1",
            storageBucket: "jimmy-27ea1.appspot.com",
            messagingSenderId: "1053115589398",
            appId: "1:1053115589398:web:f8f300891ea3c2d81be637",
            measurementId: "G-0VV0WP7VZ3"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let settings = {};
        let allPages = [];

        // Init Three.js background
        function initThreeJS() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            document.getElementById('three-bg').appendChild(renderer.domElement);

            const geometries = [
                new THREE.TetrahedronGeometry(1, 0),
                new THREE.OctahedronGeometry(1, 0),
                new THREE.DodecahedronGeometry(1, 0),
                new THREE.IcosahedronGeometry(1, 0)
            ];
            const colors = [0x76ff03, 0x29b6f6, 0xd946ef, 0xff9800];
            const objects = [];
            for (let i = 0; i < 12; i++) {
                const geometry = geometries[Math.floor(Math.random() * geometries.length)];
                const material = new THREE.MeshPhongMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)],
                    emissive: colors[Math.floor(Math.random() * colors.length)],
                    emissiveIntensity: 0.2,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.5
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.x = (Math.random() - 0.5) * 30;
                mesh.position.y = (Math.random() - 0.5) * 20;
                mesh.position.z = (Math.random() - 0.5) * 30;
                mesh.userData = { rotSpeed: { x: Math.random() * 0.02, y: Math.random() * 0.02, z: Math.random() * 0.02 }, float: Math.random() * 0.005 + 0.001 };
                scene.add(mesh);
                objects.push(mesh);
            }
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0x76ff03, 0.8);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);
            const pointLight = new THREE.PointLight(0x29b6f6, 0.6, 100);
            pointLight.position.set(-10, -10, 5);
            scene.add(pointLight);
            camera.position.z = 25;

            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            function animate() {
                requestAnimationFrame(animate);
                objects.forEach((obj, i) => {
                    obj.rotation.x += obj.userData.rotSpeed.x;
                    obj.rotation.y += obj.userData.rotSpeed.y;
                    obj.rotation.z += obj.userData.rotSpeed.z;
                    obj.position.y += Math.sin(Date.now() * obj.userData.float + i) * 0.005;
                    obj.position.x += (mouseX * 0.5 - obj.position.x) * 0.01;
                    obj.position.y += (mouseY * 0.5 - obj.position.y) * 0.01;
                });
                camera.position.x = Math.sin(Date.now() * 0.0005) * 5;
                camera.position.y = Math.cos(Date.now() * 0.0003) * 2;
                camera.lookAt(scene.position);
                renderer.render(scene, camera);
            }
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function initParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 10 + 5;
                p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation:floatP ${Math.random()*20+10}s ${Math.random()*5}s infinite linear;opacity:${Math.random()*0.3+0.1}`;
                container.appendChild(p);
            }
            const style = document.createElement('style');
            style.textContent = `@keyframes floatP { 0% { transform: translate(0,0) rotate(0deg); } 25% { transform: translate(${Math.random()*100-50}px, ${Math.random()*100-50}px) rotate(90deg); } 50% { transform: translate(${Math.random()*100-50}px, ${Math.random()*100-50}px) rotate(180deg); } 75% { transform: translate(${Math.random()*100-50}px, ${Math.random()*100-50}px) rotate(270deg); } 100% { transform: translate(0,0) rotate(360deg); } }`;
            document.head.appendChild(style);
        }

        // --- DATA LOADING ---
        async function loadAll() {
            try {
                const settingsSnap = await getDoc(doc(db, "settings", "general"));
                if (settingsSnap.exists()) {
                    settings = settingsSnap.data();
                    document.getElementById('site-name').textContent = settings.siteName || 'CMS';
                    document.getElementById('footer-text').textContent = settings.footerText || 'Powered by Firebase CMS';
                    document.title = settings.siteName || 'CMS';
                }

                const pagesQuery = query(collection(db, "pages"), where("status", "==", "published"), orderBy("title"));
                const pagesSnap = await getDocs(pagesQuery);
                allPages = [];
                pagesSnap.forEach(d => allPages.push({ id: d.id, ...d.data() }));

                const navContainer = document.getElementById('nav-links');
                allPages.forEach(page => {
                    const btn = document.createElement('button');
                    btn.textContent = page.title;
                    btn.onclick = () => showPage(page.slug);
                    navContainer.appendChild(btn);
                });

                showHome();
            } catch (e) {
                console.error(e);
                document.getElementById('content-area').innerHTML = '<div class="loading"><p>Error loading data.</p></div>';
            }
        }

        // --- VIEWS ---
        window.showHome = () => {
            const area = document.getElementById('content-area');
            let pageLinks = '';
            allPages.slice(0, 4).forEach(p => {
                pageLinks += `<button class="btn btn-outline" onclick="showPage('${p.slug}')">${p.title}</button>`;
            });
            area.innerHTML = `
                <div class="hero">
                    <h1>${settings.siteName || 'Welcome'}</h1>
                    <p>${settings.siteDescription || 'Content Management System powered by Firebase.'}</p>
                    <div class="cta-btns">
                        <button class="btn-primary" onclick="showPosts()">Browse Posts</button>
                        ${pageLinks}
                    </div>
                </div>
            `;
            document.title = settings.siteName || 'CMS';
            setActiveNav(0);
        };

        window.showPosts = async () => {
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const q = query(collection(db, "posts"), where("status", "==", "published"), orderBy("title"));
                const snap = await getDocs(q);
                if (snap.empty) {
                    area.innerHTML = '<div class="hero"><h1>Posts</h1><p style="color:var(--text2)">No posts yet.</p></div>';
                    return;
                }
                let html = '<div class="section-title">Latest Posts</div><div class="posts-grid">';
                snap.forEach(d => {
                    const p = d.data();
                    html += `
                        <div class="post-card" onclick="openPostModal('${d.id}')">
                            <div class="post-image">
                                <img src="${p.image || 'https://via.placeholder.com/400x250/1a2240/76ff03?text=Post'}" alt="${p.title}">
                            </div>
                            <div class="post-info">
                                <div class="post-category">${p.category || 'General'}</div>
                                <div class="post-title">${p.title}</div>
                                <div class="post-excerpt">${p.excerpt || p.content.substring(0, 100) + '...'}</div>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                area.innerHTML = html;
                document.title = `Posts - ${settings.siteName || 'CMS'}`;
                setActiveNav(1);

                gsap.from('.post-card', { opacity: 0, y: 40, duration: 0.5, stagger: 0.08, ease: "back.out(1.7)" });
            } catch (e) {
                area.innerHTML = '<div class="loading"><p>Error loading posts.</p></div>';
            }
        };

        window.showPage = async (slug) => {
            const area = document.getElementById('content-area');
            area.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            try {
                const page = allPages.find(p => p.slug === slug);
                if (page) {
                    area.innerHTML = `
                        <h1 style="color:var(--green);font-size:2rem;margin-bottom:20px;">${page.title}</h1>
                        <div class="page-content">${page.content || '<p>No content.</p>'}</div>
                    `;
                    document.title = `${page.title} - ${settings.siteName || 'CMS'}`;
                    setActiveNav(-1);
                } else {
                    area.innerHTML = '<div class="hero"><h1>Page Not Found</h1></div>';
                }
            } catch (e) {
                area.innerHTML = '<div class="loading"><p>Error loading page.</p></div>';
            }
        };

        window.showContact = () => {
            const area = document.getElementById('content-area');
            area.innerHTML = `
                <div class="section-title">Contact</div>
                <div class="contact-grid">
                    ${settings.contactEmail ? `<div class="contact-item"><span class="contact-icon">📧</span> ${settings.contactEmail}</div>` : ''}
                    <div class="contact-item"><span class="contact-icon">🌐</span> ${settings.siteName || 'CMS'}</div>
                </div>
            `;
            document.title = `Contact - ${settings.siteName || 'CMS'}`;
            setActiveNav(2);
        };

        window.showAdminLink = () => {
            window.location.href = 'admin.html';
        };

        // --- MODAL ---
        window.openPostModal = async (id) => {
            try {
                const snap = await getDoc(doc(db, "posts", id));
                if (!snap.exists()) return;
                const p = snap.data();
                document.getElementById('modalPostTitle').textContent = p.title;
                document.getElementById('modalPostCategory').textContent = p.category || '';
                document.getElementById('modalPostContent').innerHTML = p.content || '';
                const img = document.getElementById('modalPostImage');
                if (p.image) {
                    img.src = p.image;
                    img.style.display = 'block';
                } else {
                    img.style.display = 'none';
                }
                document.getElementById('postModal').classList.add('active');
            } catch (e) { console.error(e); }
        };

        window.closeModal = () => {
            document.getElementById('postModal').classList.remove('active');
        };
        document.getElementById('postModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        function setActiveNav(index) {
            const buttons = document.querySelectorAll('#nav-links button');
            buttons.forEach((btn, i) => btn.classList.toggle('active', i === index));
        }

        // --- INIT ---
        window.addEventListener('load', () => {
            initThreeJS();
            initParticles();
            loadAll();
        });
    </script>
</body>
</html>
