<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to manage site content.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235488c0'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='white'%3ED%3C/text%3E%3C/svg%3E">
    <title>Sign in - CMS Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5488c0;
            --primary-d: #3f6da3;
            --bg-start: #a9c5e3;
            --bg-end: #4da6a9;
            --paper: #f4f1ea;
            --paper-edge: #e2dec9;
            --ink: #334155;
            --ink-soft: #64748b;
            --accent: #4ade80;
            --accent-d: #16a34a;
            --danger: #e5484d;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--ink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
        }

        .checkered-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.4;
            background-image:
                linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.1) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.1) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.1) 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }

        .paper-panel {
            clip-path: polygon(1% 2%, 98% 1%, 100% 98%, 2% 100%, 0% 50%);
        }

        .paper-scrap {
            clip-path: polygon(5% 0%, 95% 5%, 100% 90%, 92% 100%, 8% 95%, 0% 80%);
        }

        .wavy-button {
            clip-path: polygon(0% 20%, 15% 0%, 85% 10%, 100% 20%, 95% 80%, 80% 100%, 20% 90%, 0% 80%);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        :focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: var(--paper);
            border-right: 4px solid var(--paper-edge);
            border-bottom: 4px solid var(--paper-edge);
            box-shadow: 8px 8px 0px rgba(0, 0, 0, 0.12);
            padding: 40px 36px 32px;
            width: 100%;
            max-width: 420px;
        }

        .login-box h1 {
            font-family: 'Fredoka One', cursive;
            font-weight: 400;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--ink);
            margin: 0 0 6px;
            font-size: 1.5rem;
        }

        .login-box h1 .accent { color: var(--primary); }

        .login-box .sub {
            color: var(--ink-soft);
            font-size: 0.92rem;
            font-weight: 600;
            margin: 0 0 24px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin: 16px 0 6px;
        }

        input {
            width: 100%;
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.6);
            border: none;
            border-bottom: 3px dashed var(--primary);
            color: var(--ink);
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            transition: border 0.2s ease, background 0.2s ease;
        }

        input:focus {
            outline: none;
            background: #fff;
            border-bottom-style: solid;
        }

        input[aria-invalid="true"] {
            border-bottom-color: var(--danger);
            border-bottom-style: solid;
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-bottom: 6px solid var(--accent-d);
            font-family: 'Fredoka One', cursive;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 26px;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button[type="submit"]:hover {
            transform: scale(1.03);
            filter: brightness(1.05);
        }

        button[type="submit"]:active {
            transform: translateY(2px);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }

        .error-msg {
            color: var(--danger);
            background: rgba(229, 72, 77, 0.08);
            border: 2px dashed rgba(229, 72, 77, 0.5);
            font-size: 0.88rem;
            font-weight: 600;
            padding: 10px 14px;
            margin-bottom: 6px;
            display: none;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 20px;
            color: var(--ink-soft);
            font-size: 0.88rem;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .back-link:hover {
            color: var(--primary);
        }

        .version-tag {
            position: fixed;
            bottom: 18px;
            left: 18px;
            background: rgba(255, 255, 255, 0.4);
            padding: 4px 12px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: var(--ink);
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="checkered-bg" aria-hidden="true"></div>

    <main class="login-box paper-panel">
        <h1>CMS <span class="accent">sign in</span></h1>
        <p class="sub">Sign in to manage site content.</p>

        <div class="error-msg" id="error-msg" role="alert"></div>

        <form id="loginForm" novalidate>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="admin@example.com" required autocomplete="username">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
            <button type="submit" id="login-btn" class="wavy-button"><span>Sign in</span><span class="material-symbols-outlined">check_circle</span></button>
        </form>
        <a class="back-link" href="index.html"><span class="material-symbols-outlined" style="font-size:1.1rem;">arrow_back</span> Back to site</a>
    </main>

    <div class="version-tag paper-scrap">CMS V1.0</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- KONFIGURASI FIREBASE (SAMA SEPERTI SEBELUMNYA) ---
        const firebaseConfig = {
            apiKey: "AIzaSyDxqQOEuFjIR2W9-lrtAjaYsqPMHa8-6X4",
            authDomain: "jimmy-27ea1.firebaseapp.com",
            databaseURL: "https://jimmy-27ea1.firebaseio.com",
            projectId: "jimmy-27ea1",
            storageBucket: "jimmy-27ea1.appspot.com",
            messagingSenderId: "1053115589398",
            appId: "1:1053115589398:web:f8f300891ea3c2d81be637",
            measurementId: "G-0VV0WP7VZ3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailEl = document.getElementById('email');
            const passEl = document.getElementById('password');
            const errorDiv = document.getElementById('error-msg');
            const btn = document.getElementById('login-btn');
            const email = emailEl.value.trim();
            const password = passEl.value;

            const showError = (msg) => {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            };

            errorDiv.style.display = 'none';
            emailEl.removeAttribute('aria-invalid');
            passEl.removeAttribute('aria-invalid');

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailEl.setAttribute('aria-invalid', 'true');
                showError('Enter a valid email address.');
                emailEl.focus();
                return;
            }
            if (!password) {
                passEl.setAttribute('aria-invalid', 'true');
                showError('Enter your password.');
                passEl.focus();
                return;
            }

            btn.disabled = true;
            btn.querySelector('span').textContent = 'Signing in…';

            // Query ke collection 'users'
            // Kita cari berdasarkan email, lalu cek password di JS untuk menghindari error index
            const q = query(collection(db, "users"), where("email", "==", email));

            try {
                const querySnapshot = await getDocs(q);
                let userFound = false;

                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    // Cek Password (Hardcoded check sesuai permintaan)
                    if (userData.password === password) {
                        userFound = true;
                        // Simpan status login di LocalStorage
                        localStorage.setItem('isLoggedIn', 'true');
                        localStorage.setItem('userName', userData.name);
                        localStorage.setItem('userRole', userData.role || 'editor');
                        // Redirect ke halaman admin
                        window.location.href = "admin.html";
                    }
                });

                if (!userFound) {
                    showError('Incorrect email or password.');
                    setTimeout(() => errorDiv.style.display = 'none', 4000);
                }

            } catch (error) {
                console.error("Error login:", error);
                showError('Sign-in failed. Check your connection and try again.');
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Sign in';
            }
        });
    </script>

</body>

</html>
